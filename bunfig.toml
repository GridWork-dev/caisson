[test]
# CAISSON-12: a bare `bun test` (no path arg) recursively discovers every *.test.ts/js
# under cwd, including stale compiled dist/ output left by a prior `bun run build` — a
# real repro under two service packages and tooling/testing. Every wired
# script already scopes explicitly (`bun test ./src`, `bun test ./live`), so this is
# defense-in-depth for the one invocation shape that isn't: a bare `bun test` from the
# repo root.
# Limitation: bun does not walk up the tree for bunfig.toml, so a bare `bun test` run
# from inside a package/app subdir (not the repo root) is still unprotected here — accepted,
# since every wired script scopes explicitly as noted above.
pathIgnorePatterns = ["**/dist/**"]

[install]
# Supply-chain wait window (Kickoff T task 1): never install a package version younger than
# 7 days — the window in which malicious releases are typically caught and yanked. Interaction
# with Renovate: Renovate PRs opened against a <7-day-old version will fail install until the
# version ages past the window (or is superseded); that delay is the point, not a bug.
minimumReleaseAge = 604800
# Deliberate adoptions inside the window are exempted HERE, dated, and removed once aged.
# There are currently no exemptions.
# (2026-07-27 CAISSON dependency-baseline rework: the Renovate PR #351 non-major batch
#  — better-auth/@better-auth/*, the @opentelemetry/* logs+trace+instrumentation set,
#  storybook+@storybook/*+eslint-plugin-storybook, playwright — was NOT re-exempted here.
#  Audited against osv-scanner + trivy + upstream changelogs/GHSA search: none of those
#  bumps fix a known advisory (the two real OTel GHSAs in play, GHSA-q7rr-3cgh-j5r3 and
#  GHSA-45rx-2jwx-cxfr, were already patched in the versions already on main before this
#  batch). Those package updates were reverted out of PR #352 back to main's versions
#  instead of exempted; Renovate will re-propose them once they clear the window
#  naturally. kysely 0.29.4 and vite 8.1.5 needed no exemption either — both had already
#  aged past 7 days by the time this landed.)
