# (docs/security/paid-tooling-roi.md), which stays wired regardless of this section.
# Blocked on upstream bun issue #31028 (a scanner declared in devDependencies is dropped
# by the --production hoist filter, so `bun install --frozen-lockfile --production` hard-fails
# with "no packages were installed during security scanner installation"; fix PR #31031 is open,
# unmerged). Live-reproduced on the exact pinned CI version, bun 1.3.14, 2026-07-19 — still
