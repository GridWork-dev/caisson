[test]
# CAISSON-12: a bare `bun test` (no path arg) recursively discovers every *.test.ts/js
# under cwd, including stale compiled dist/ output left by a prior `bun run build` — a
# real repro tonight under services/docs, services/license, tooling/testing. Every wired
# script already scopes explicitly (`bun test ./src`, `bun test ./live`), so this is
# defense-in-depth for the one invocation shape that isn't: a bare `bun test` from the
# repo root.
# Limitation: bun does not walk up the tree for bunfig.toml, so a bare `bun test` run
# from inside a package/app subdir (not the repo root) is still unprotected here — accepted,
# since every wired script scopes explicitly as noted above.
pathIgnorePatterns = ["**/dist/**"]

[install]
# Supply-chain wait window (Kickoff T task 1): never install a package version younger than
# 7 days — the window in which malicious releases are typically caught and yanked. Interaction
# with Renovate: Renovate PRs opened against a <7-day-old version will fail install until the
# version ages past the window (or is superseded); that delay is the point, not a bug.
minimumReleaseAge = 604800
# Deliberate adoptions inside the window are exempted HERE, dated, and removed once aged:
# (Expired + removed 2026-07-24: ai/@ai-sdk/* and the storybook 10.5.0 set — due 2026-07-17;
#  vite — due 2026-07-16; @hono/node-server — due 2026-07-23.)
# - fast-uri: 3.1.4 is the osv-scanner fix for GHSA-v2hh-gcrm-f6hx (published 2026-07-19), pulled
#   in by the root `overrides` CVE-dep-bump wave — remove after 2026-07-26.
# - next: 16.2.11 is the coordinated Next.js security release fixing 9 CVEs in 16.2.10 (4 High:
#   middleware auth bypass GHSA-6gpp-xcg3-4w24, SSRF x2, Server-Actions DoS; published 2026-07-23).
#   An official advisory-backed security release is the opposite of the silent-poisoned-release this
#   floor defends against; operator-approved 2026-07-23 — remove after 2026-07-30.
minimumReleaseAgeExcludes = ["fast-uri", "next", "@next/env", "@next/swc-darwin-arm64", "@next/swc-darwin-x64", "@next/swc-linux-arm64-gnu", "@next/swc-linux-arm64-musl", "@next/swc-linux-x64-gnu", "@next/swc-linux-x64-musl", "@next/swc-win32-arm64-msvc", "@next/swc-win32-x64-msvc"]

