name: Documentation problem
description: Something in the docs or on caisson.sh is wrong, missing or unclear.
labels: [docs]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL or file path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: What the docs say, and what they should say instead.
    validations:
      required: true
