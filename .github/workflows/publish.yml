name: publish
# publish-and-index: previously declared `needs: [check, standards-gate, registry-index]` inside
# ci.yml. GitHub Actions' `needs:` only resolves job IDs within the SAME workflow run — it cannot
# reference a job defined in another file (an unresolvable `needs:` fails the whole workflow at
# parse time: "Job depends on unknown job"). Now that those three jobs live in ci.yml and this job
# lives here, the `needs:` is intentionally DROPPED; the ordering is enforced structurally instead —
# this workflow triggers on `push: branches: [main]`, which only fires after a PR has already merged
# to main, which only happens after ci.yml's three required checks passed on that PR. Main-only
# (ADR-0021).
#
# Buyer delivery = self-hosted npm registry (registry.caisson.sh, ADR-0223). The dead GitHub-Packages
# leg (`changeset publish` + the ~/.npmrc `_authToken` write) is RETIRED here: buyers install commercial
# tarballs from R2 via the CF Worker, not from GH Packages. This job now, per changed non-private
# package: `bun pm pack` → hash (SHA-1 shasum + sha512 SRI integrity) → record a sidecar row into
# registry/tarballs.json → upload the tarball to R2. It also closes the latent version-commit gap:
# `changeset version` bumps package.json/CHANGELOG.md + consumes .changeset/*.md, and the commit step
# now stages all of that alongside ledger.jsonl + index.json + tarballs.json.
#
# Auth: built-in GITHUB_TOKEN ephemeral for the commit-back to main (NO stored PAT — ADR-0069). R2
# writes use S3-compatible scoped R2 access keys (Fork 2.1: R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY /
# R2_ACCOUNT_ID repo secrets, bucket caisson-registry-tarballs). Everything is guarded by
# CAISSON_PUBLISH_DRY_RUN (default "true"): dry-run logs the pack/hash/key/upload plan and writes
# NOTHING (no bumps, no R2 upload, no commit). Set it "false" operator-side to go live.
#
# P5-25: GHEC provenance attestation = DECLINED. Lightweight provenance is already embedded in
#        each LedgerEntry's gateAttestation field ("<run-id>@<commit-sha>"); a full SLSA/GHEC
#        attestation blob is deferred to a post-P5 hardening pass.
on:
  push:
    branches: [main]
  # One-shot operator lever: a manual dispatch with dry_run=false runs ONE live consume
  # (changeset version + ledger/index + R2 tarball upload + commit-back). Push-triggered runs
  # stay dry-run — the hardcoded-default below only flips per-dispatch, never latches.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to 'false' to run a LIVE publish (version bumps + R2 upload + commit to main)"
        required: false
        default: "true"

permissions:
  contents: read

# The shared ci.yml concurrency group used to serialize this job against rapid main pushes; now
# that it's split out, give it its own group. cancel-in-progress: false (not true) — this job
# uploads tarballs and pushes a registry commit back to main, so an in-flight run must finish
# rather than be killed mid-step; a second rapid push just queues behind it.
concurrency:
  group: publish-and-index
  cancel-in-progress: false

jobs:
  publish-and-index:
    if: github.ref == 'refs/heads/main'
    # STAYS GitHub-hosted: this job holds contents:write, uploads to R2, and pushes commits to main.
    # Write/publish privilege belongs on a clean hosted runner, not the fleet (mirrors gridwork-core
    # keeping its egress/write jobs hosted). Main-only + dry-run-by-default, so it runs rarely and
    # gains nothing from fleet compute. `aws` CLI is preinstalled on ubuntu-latest (R2 S3 API upload).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # Operator publish gate (ADR-0069/0223). Default is dry-run; a workflow_dispatch with
      # dry_run=false runs one live consume. Push events have no inputs → falls back to "true".
      CAISSON_PUBLISH_DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so changesets can read tags; built-in GITHUB_TOKEN for commit-back
          # (not a stored PAT — the ephemeral token does not trigger downstream CI runs).
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Bump package.json / CHANGELOG.md + consume .changeset/*.md (live only). The commit step
      # below stages what this produces — closing the latent version-commit gap (config `commit:false`,
      # no changesets/action, so this job is the only place the bumps can land). Dry-run skips it so
      # the working tree stays clean and no commit is pushed to main.
      - name: changeset version (live only — set CAISSON_PUBLISH_DRY_RUN=false to go live)
        run: |
          if [ "${CAISSON_PUBLISH_DRY_RUN}" != "false" ]; then
            echo "[publish-and-index] dry-run: changeset version skipped (CAISSON_PUBLISH_DRY_RUN=${CAISSON_PUBLISH_DRY_RUN})"
          else
            bunx changeset version
          fi
      # Scan workspace manifest.ts → append newly-published versions to the ledger → rebuild
      # registry/index.json → (live) pack each non-private package (`bun pm pack`), hash it
      # (SHA-1 shasum + sha512 SRI integrity), record a row into registry/tarballs.json, and stage
      # the tarball at registry/.tarball-staging/<slug>/<slug>-<version>.tgz for the R2 upload step.
      # Dry-run reports the planned set and writes nothing.
      - name: append ledger + rebuild index + pack/record tarball sidecar
        run: |
          bun registry/scripts/ci-publish-step.ts \
            --run-id "${{ github.run_id }}" \
            --sha "${{ github.sha }}" \
            --published-at "$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')" \
            --dry-run "${CAISSON_PUBLISH_DRY_RUN}"
      # Upload the staged tarballs to R2 (Fork 2.1: S3-compatible scoped access keys). The R2 write is
      # gated by CAISSON_PUBLISH_DRY_RUN — dry-run stages nothing (the step above skips packing) so
      # this logs the plan and uploads nothing. Keys are preserved from the staging tree:
      # registry/.tarball-staging/<slug>/<slug>-<version>.tgz -> s3://<bucket>/<slug>/<slug>-<version>.tgz.
      - name: upload tarballs to R2 (live only)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: caisson-registry-tarballs
        run: |
          STAGING="registry/.tarball-staging"
          if [ "${CAISSON_PUBLISH_DRY_RUN}" = "false" ]; then
            if [ -d "$STAGING" ] && [ -n "$(ls -A "$STAGING" 2>/dev/null)" ]; then
              # ponytail: aws s3 sync (preinstalled). If R2 rejects the default integrity headers,
              # export AWS_REQUEST_CHECKSUM_CALCULATION=when_required — a Task-5 deploy-time tune.
              aws s3 sync "$STAGING" "s3://${R2_BUCKET}/" \
                --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                --no-progress
              echo "[publish-and-index] uploaded staged tarballs to R2 bucket ${R2_BUCKET}"
            else
              echo "[publish-and-index] no staged tarballs to upload"
            fi
          else
            echo "[publish-and-index] dry-run: R2 upload skipped (CAISSON_PUBLISH_DRY_RUN=${CAISSON_PUBLISH_DRY_RUN})"
          fi
      # Commit what `changeset version` produced (bumped package.json + written CHANGELOG.md + consumed
      # .changeset deletions) alongside the registry outputs (ledger.jsonl + index.json + tarballs.json)
      # back to main. Pathspecs cover EVERY workspace (apps/services/registry/tooling get dependent
      # bumps too — the first live run proved `packages/*` alone leaves ~40 files unstaged and the
      # rebase dies on them); registry/.tarball-staging/ is untracked and never staged, so packed
      # tarballs never enter git. A loud leftovers check runs before the rebase so a future new
      # write-site fails with filenames instead of a bare git error. In dry-run the tree is clean →
      # nothing staged → no commit. git pull --rebase guards concurrent writes.
      - name: commit version bumps + registry files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            ':(glob)**/package.json' ':(glob)**/CHANGELOG.md' '.changeset' \
            registry/ledger.jsonl registry/index.json registry/tarballs.json
          if git diff --cached --quiet; then
            echo "[publish-and-index] nothing to commit"
          else
            if ! git diff --quiet; then
              echo "[publish-and-index] FATAL: tracked changes left unstaged after the pathspec add:"
              git status --short
              exit 1
            fi
            git commit -m "chore(registry): publish tarballs + append ledger + version bump [ci-publish]"
            git pull --rebase origin main
            git push
          fi
