name: publish
# The ADR-0325 zero-mutation publish leg: checkout EXACTLY the release tag, verify the tagged
# tree already IS the release (every workspace version ledgered + sidecar'd, index.json a
# byte-identical rebuild), re-pack every tarball and require byte-equality with the hashes the
# version PR recorded, then upload to R2 — skipping any object that already exists (rerun-safe,
# never overwrite a version-keyed object). NO step on this path mutates source: `changeset
# version`, the ledger append, the index rebuild, and the commit-back all moved to
# version-pr.yml (the automation-authored version PR, ADR-0325 point 1). One SHA — the tagged
# version commit — anchors source, ledger, tarballs, and evidence.
#
# ORDERING (structural, not `needs:` — GitHub Actions `needs:` cannot cross workflow files):
# this workflow only runs via workflow_dispatch (the release train's leg 1, or a manual operator
# dispatch), and the train's readiness job has already verified ci.yml's required checks green
# on the release SHA before dispatching. Main-only (ADR-0021); the tag must be an ancestor of
# origin/main (verified below).
#
# Buyer delivery = self-hosted npm registry (registry.caisson.sh, ADR-0223). Auth: R2 writes use
# S3-compatible scoped R2 access keys (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID
# repo secrets, bucket caisson-registry-tarballs). contents:write is GONE — this job pushes
# nothing anywhere (the old commit-back was the ADR-0325 provenance defect).
#
# Everything is guarded by CAISSON_PUBLISH_DRY_RUN (default "true"): dry-run verifies the
# ledger/sidecar/index consistency at the tag and logs the upload plan, writing NOTHING to R2.
# Dispatch with dry_run=false (the train passes it) for a live publish.
#
# P5-25: GHEC provenance attestation = DECLINED. Lightweight provenance is already embedded in
#        each LedgerEntry's gateAttestation field; a full SLSA/GHEC attestation blob is deferred
#        (re-raised by the 2026-07-11 Codex audit as a possible rider — still deferred, the
#        version-PR + tag-anchored flow closes the gap it targeted).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish (checked out, verified, and published byte-exact)"
        required: true
      dry_run:
        description: "Set to 'false' to run a LIVE publish (verify at the tag + upload missing tarballs to R2)"
        required: false
        default: "true"

permissions:
  contents: read

# cancel-in-progress: false (not true) — an in-flight run uploads tarballs, so it must finish
# rather than be killed mid-step; a second dispatch queues behind it.
concurrency:
  group: publish-and-index
  cancel-in-progress: false

jobs:
  publish-and-index:
    if: github.ref == 'refs/heads/main'
    # STAYS GitHub-hosted: this job holds R2 write credentials. Write/publish privilege belongs
    # on a clean hosted runner, not third-party compute (ADR-0326). `aws` CLI is preinstalled.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # ADR-0327 rider 2 (definition-first; free-plan protection rules can't enforce yet)
    env:
      # Operator publish gate (ADR-0069/0223). Default is dry-run; the release train dispatches
      # with dry_run=false.
      CAISSON_PUBLISH_DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      RELEASE_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Checkout EXACTLY the tagged bytes (ADR-0325 point 4). Full history so the
          # tag-on-main ancestry check below can resolve origin/main.
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
      # A tag not on main must never publish — the readiness gate checks this too, but a manual
      # dispatch can reach this workflow without the train.
      - name: verify the tag is an ancestor of origin/main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag ${RELEASE_TAG} ($(git rev-parse --short HEAD)) is not an ancestor of origin/main — refusing to publish"
            exit 1
          fi
          echo "[publish-and-index] tag ${RELEASE_TAG} -> $(git rev-parse HEAD) (on main)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Zero-mutation verify + stage (ADR-0325): every workspace version must be ledgered +
      # sidecar'd, index.json must be a byte-identical ledger rebuild, and every re-packed
      # tarball must hash to EXACTLY the sidecar row the version PR recorded. Any violation
      # fails here, before the R2 step. Dry-run verifies metadata and skips packing.
      - name: verify tagged bytes + stage tarballs (publish mode)
        run: |
          bun registry/scripts/ci-publish-step.ts \
            --mode publish \
            --run-id "${{ github.run_id }}" \
            --sha "$(git rev-parse HEAD)" \
            --published-at "$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')" \
            --dry-run "${CAISSON_PUBLISH_DRY_RUN}"
      # Upload staged tarballs to R2 — per-object head-object first: an existing version-keyed
      # object is NEVER overwritten (ADR-0325 point 5); reruns upload only what is missing.
      - name: upload missing tarballs to R2 (live only, never overwrite)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: caisson-registry-tarballs
        run: |
          set -euo pipefail
          STAGING="registry/.tarball-staging"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if [ "${CAISSON_PUBLISH_DRY_RUN}" != "false" ]; then
            echo "[publish-and-index] dry-run: R2 upload skipped (CAISSON_PUBLISH_DRY_RUN=${CAISSON_PUBLISH_DRY_RUN})"
            exit 0
          fi
          if [ ! -d "$STAGING" ] || [ -z "$(ls -A "$STAGING" 2>/dev/null)" ]; then
            echo "[publish-and-index] no staged tarballs to upload"
            exit 0
          fi
          uploaded=0; skipped=0
          while IFS= read -r -d '' f; do
            key="${f#"$STAGING"/}"
            if aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
                 --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
              echo "[publish-and-index] exists, skipping (never overwrite): $key"
              skipped=$((skipped + 1))
            else
              # ponytail: aws s3 cp (preinstalled). If R2 rejects the default integrity headers,
              # export AWS_REQUEST_CHECKSUM_CALCULATION=when_required — a deploy-time tune.
              aws s3 cp "$f" "s3://${R2_BUCKET}/${key}" \
                --endpoint-url "$ENDPOINT" --no-progress
              uploaded=$((uploaded + 1))
            fi
          done < <(find "$STAGING" -type f -name '*.tgz' -print0)
          echo "[publish-and-index] R2 upload complete: ${uploaded} uploaded, ${skipped} already present (tag ${RELEASE_TAG})"
