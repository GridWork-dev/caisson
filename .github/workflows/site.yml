# Deploys caisson.sh (ADR-0428 L3): the static export of apps/site (with apps/demos under /demos)
# to Workers static assets. Runs on main pushes that can change the export, or by hand.
name: site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "apps/demos/**"
      - "packages/**"
      - "tooling/**"
      - "bun.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # wrangler runs on Node; the runner image's default Node is older than wrangler 4 needs.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@caisson/site --no-daemon
      - name: deploy
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.141.0 deploy
