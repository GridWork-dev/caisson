# greptile-gate — the REQUIRED check that replaced the blanket "Greptile Review" requirement.
#
# Credit-burn fix (2026-07-02, operator-directed): Greptile auto-review is OFF
# (.greptile/config.json → skipReview: AUTOMATIC, triggerOnUpdates: false). Reviews now run
# ONLY when this gate @-mentions greptileai — and it does that only for PRs whose diff
# touches a SECURITY-CRITICAL path (auth/tenancy/crypto/license/billing/credits/WORM/
# tool-exec/CI itself). Everything else merges on the ordinary required checks alone.
#
# Policy the gate enforces on a security-critical PR:
#   1. At least one completed Greptile review must exist on the PR.
#   2. If critical paths changed SINCE the last-reviewed commit, one re-review is
#      triggered for the new head (a push touching only non-critical files after a
#      green review does NOT re-trigger — that was the old per-push burn).
#   3. The gate waits (bounded) for the review to conclude; timeout = fail with a
#      re-run instruction, never a silent pass.
#
# Branch protection: "greptile-gate" is required; "Greptile Review" itself is no longer
# in the required contexts (it only exists on commits Greptile actually reviewed).
name: greptile-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write # @greptileai trigger comment
  statuses: read
  checks: read

concurrency:
  group: "greptile-gate-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  greptile-gate:
    runs-on: ubuntu-latest # hosted on purpose: the merge gate must not depend on the box being up
    timeout-minutes: 20
    if: ${{ !github.event.pull_request.draft }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: classify diff against the security-critical path set
        id: classify
        run: |
          # The security-critical set (money / auth / crypto / license / tenant-isolation /
          # arbitrary-exec seams + the CI+review config itself). Keep in sync with
          # .greptile/rules.md when packages are added.
          cat > /tmp/critical-globs <<'EOF'
          packages/auth/
          packages/tenancy-rls/
          packages/field-crypto/
          packages/audit-worm/
          packages/billing/
          packages/credits/
          packages/ai-meter/
          packages/license-issue/
          packages/license-verify/
          packages/mcp-server/
          packages/tool-exec/
          packages/guardrails/
          packages/kernel/
          services/license/
          services/support-bot/
          registry/
          apps/site/src/app/api/
          apps/admin/
          tooling/
          infra/
          .github/
          .greptile/
          EOF
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > /tmp/pr-files
          critical=$(grep -F -f /tmp/critical-globs /tmp/pr-files || true)
          if [ -z "$critical" ]; then
            echo "non-critical PR — no Greptile review required"
            echo "critical=false" >> "$GITHUB_OUTPUT"
          else
            echo "security-critical paths touched:"; echo "$critical" | head -20
            echo "critical=true" >> "$GITHUB_OUTPUT"
          fi

      - name: require (and if needed trigger) a Greptile review
        if: steps.classify.outputs.critical == 'true'
        run: |
          # Newest PR commit that carries a "Greptile Review" check/status = last-reviewed SHA.
          reviewed_sha=""
          for sha in $(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].sha' | tac); do
            ok=$(gh api "repos/$REPO/commits/$sha/check-runs" --jq \
              '[.check_runs[] | select(.name == "Greptile Review" and .conclusion == "success")] | length' 2>/dev/null || echo 0)
            st=$(gh api "repos/$REPO/commits/$sha/status" --jq \
              '[.statuses[] | select((.context | test("Greptile"; "i")) and .state == "success")] | length' 2>/dev/null || echo 0)
            if [ "${ok:-0}" -gt 0 ] || [ "${st:-0}" -gt 0 ]; then reviewed_sha="$sha"; break; fi
          done

          need_review=false
          if [ -z "$reviewed_sha" ]; then
            echo "no completed Greptile review on this PR yet"
            need_review=true
          elif [ "$reviewed_sha" != "$HEAD_SHA" ]; then
            # Re-review only if CRITICAL paths changed since the reviewed commit.
            changed=$(gh api "repos/$REPO/compare/$reviewed_sha...$HEAD_SHA" --jq '.files[].filename' 2>/dev/null | grep -F -f /tmp/critical-globs || true)
            if [ -n "$changed" ]; then
              echo "critical paths changed since reviewed commit $reviewed_sha:"; echo "$changed" | head -20
              need_review=true
            else
              echo "head moved but no critical-path changes since reviewed commit $reviewed_sha — review still valid"
            fi
          else
            echo "head commit already reviewed"
          fi

          if [ "$need_review" = true ]; then
            # One trigger per head SHA — skip if we already mentioned for this exact head.
            already=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq \
              "[.[] | select(.body | contains(\"@greptileai\") and contains(\"$HEAD_SHA\"))] | length")
            if [ "${already:-0}" -eq 0 ]; then
              gh pr comment "$PR" --repo "$REPO" --body "@greptileai review requested by greptile-gate (security-critical paths; head $HEAD_SHA)"
            else
              echo "review already requested for $HEAD_SHA"
            fi
            # Bounded wait for the review to conclude on the head SHA (~15 min).
            for i in $(seq 1 30); do
              sleep 30
              ok=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --jq \
                '[.check_runs[] | select(.name == "Greptile Review" and .conclusion == "success")] | length' 2>/dev/null || echo 0)
              fail=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --jq \
                '[.check_runs[] | select(.name == "Greptile Review" and .conclusion != null and .conclusion != "success")] | length' 2>/dev/null || echo 0)
              st=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq \
                '[.statuses[] | select((.context | test("Greptile"; "i")) and .state == "success")] | length' 2>/dev/null || echo 0)
              stf=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq \
                '[.statuses[] | select((.context | test("Greptile"; "i")) and (.state == "failure" or .state == "error"))] | length' 2>/dev/null || echo 0)
              if [ "${ok:-0}" -gt 0 ] || [ "${st:-0}" -gt 0 ]; then echo "Greptile review green on head"; exit 0; fi
              if [ "${fail:-0}" -gt 0 ] || [ "${stf:-0}" -gt 0 ]; then
                echo "Greptile review concluded NON-green on head — resolve findings, push, or re-run"; exit 1
              fi
            done
            echo "timed out waiting for Greptile review — re-run this check once the review posts"
            exit 1
          fi
