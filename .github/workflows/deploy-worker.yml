name: deploy-worker
# Deploy the registry-read Worker (registry.caisson.sh) from an exact ref, then PROVE the live edge
# serves that ref's index before reporting green.
#
# WHY THIS EXISTS — publishing tarballs does not make a version installable. `registry/worker/
# deploy-entry.ts` imports ../index.json and ../tarballs.json, and esbuild (via wrangler) INLINES
# them into the Worker bundle at build time. So the release train's leg 1 (publish.yml → R2 upload)
# leaves the edge serving whatever index it was last deployed with, and until this workflow existed
# the only way to move it was an operator running registry/worker/deploy.sh by hand.
#
# That gap was not theoretical. On the v2026.07.30 ride every leg went green and `bun add
# @caisson/kernel` still resolved 0.6.0 — while leg 4 had already put the site live advertising
# `@caisson/kernel/node`, an entry point that does not exist at 0.6.0. A buyer following the
# freshly-published docs would have hit a broken import. Readiness check 4b does not cover this: it
# validates the REPO's index/tarball consistency and never asks what the live edge actually serves.
#
# ORDERING (load-bearing): the train runs this as leg 1b — after leg 1 uploads the tarballs (a
# resolvable version whose bytes 404 is worse than a stale one) and before leg 4 puts the site live
# (the site advertises what the registry must already resolve). It is NOT leg 5 for that reason.
#
# No arm guard: wrangler in a non-interactive shell hard-fails without CLOUDFLARE_API_TOKEN, so a
# missing credential is already loud. The inert-until-armed dance in deploy-railway.yml exists
# because a push-triggered job had to stay green pre-arming; this workflow is dispatch-only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (ancestry-verified against origin/main). Blank = the dispatch ref. The release train passes the release tag."
        required: false
        default: ""

permissions:
  contents: read

# cancel-in-progress: false — a killed run can leave the edge mid-rollout; a second dispatch queues.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    # Blacksmith per ADR-0365/0367: a credentialed deploy belongs on VM-per-job hosted compute.
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: release # ADR-0327 rider 2 (definition-first; free-plan protection rules can't enforce yet)
    steps:
      # actions/checkout resolves branches and tags only — a bare sha dies at "Determining the
      # checkout info" with an error that is easy to misread as a permissions problem (run
      # 31340131203, CAISSON-191). Reject it up front with an actionable message.
      - name: reject bare-sha refs
        if: github.event.inputs.ref != ''
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref }}
        run: |
          if printf '%s' "$DEPLOY_REF" | grep -qiE '^[0-9a-f]{7,40}$'; then
            echo "::error::ref '${DEPLOY_REF}' looks like a bare commit sha — actions/checkout takes a branch or tag only (blank = the dispatch ref). Pass the branch or tag that contains the commit."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Blank input → the dispatch ref. Full history so the ancestry check can resolve origin/main.
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      # Same rule as publish.yml: a ref that is not on main must never reach a production surface.
      - name: verify the ref is an ancestor of origin/main
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref }}
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::ref ${DEPLOY_REF:-$(git rev-parse --short HEAD)} is not an ancestor of origin/main — refusing to deploy"
            exit 1
          fi
          echo "[deploy-worker] ${DEPLOY_REF:-HEAD} -> $(git rev-parse HEAD) (on main)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      # The wrangler shim runs under `env node` and wrangler 4.x requires Node >= 22; the
      # Blacksmith image ships v20 (proof run 31410273428 failed loud on exactly this).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # deploy.sh builds three workspace packages before bundling, and execs the PINNED wrangler
      # shim at registry/node_modules/.bin/wrangler directly (bun does not hoist workspace bins to
      # root, and bunx falls back to PATH/npm — the resolution that silently killed run
      # 31340167627, CAISSON-191).
      - run: bun install --frozen-lockfile
      - name: deploy the Worker (inlines this ref's registry/index.json)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash registry/worker/deploy.sh
      # The deploy is not the proof. Assert the LIVE edge now serves this ref's versions — scoped to
      # the worker leg, because the train has not redeployed admin/site/license yet and a full-fleet
      # probe would red on surfaces this leg never touched.
      #
      # Retry loop, not a fixed sleep: a wrangler deploy takes up to ~a minute to reach every colo,
      # and on the v2026.07.30 ride probing immediately read the PREVIOUS dist-tags.latest and sent
      # the operator chasing a stale bundle that did not exist.
      - name: verify the live edge serves this ref's index
        run: |
          # The anonymous probe sees only the entries the edge serves UNENTITLED (the Apache-2.0
          # base set, ~17 of 54) — the entitlement resolver hides commercial entries, so a release
          # bumping only commercial modules can pass here while the commercial catalog still
          # propagates. The probe's doc comment records the same limit; the notice stays qualified.
          for attempt in 1 2 3 4 5; do
            if bun registry/scripts/index-parity-probe.ts --only worker; then
              echo "::notice::registry.caisson.sh serves the deployed index — public-entry scope; commercial entries are not anonymously probeable (attempt ${attempt})"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "::notice::edge not settled yet (attempt ${attempt}/5) — retrying in 30s"
              sleep 30
            fi
          done
          echo "::error::registry.caisson.sh still disagrees with the deployed index after ~2 minutes of propagation grace"
          exit 1
