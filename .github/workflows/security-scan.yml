name: security-scan
# The deterministic security layer (SAST + supply-chain), split into its own workflow per the
# ci.yml convention. REQUIRED since the ADR-0327 scan-gate flip (sequenced after the CAISSON-95
# pinning in this same change): `deterministic` joins the required-check set — check ·
# standards-gate · registry-index · oscal-conformance · deterministic. As with the other four,
# "required" is discipline on this free-plan private repo (no enforced branch protection): the
# convention is enforced by scripts/release-readiness.ts (REQUIRED_CHECKS) and review practice,
# not a GitHub gate. `semgrep-pro` stays advisory (dormant until its token is provisioned).
# Runs the repo-local tools/security/scan.sh — the same driver the operator runs locally.
#
# Scanner installs are version-pinned + digest-verified against tools/security/versions.env
# (CAISSON-95) — no curl|sh from a moving main branch, no floating `latest`. The only third-party
# marketplace action is the SHA-pinned astral-sh/setup-uv (same pin as support-bot.yml). No SARIF
# upload to the GitHub Security tab — that needs Advanced Security, which this private free-plan
# repo doesn't have; the SARIF set is saved as a downloadable artifact instead.
#
# The Semgrep PRO leg is a separate job gated on the SEMGREP_APP_TOKEN secret (a new external
# egress sink to semgrep.dev — see identity/security-surfaces.md). It stays dormant until the
# token is provisioned.
on:
  push:
    branches: [main]
  pull_request:
    # Defaults plus ready_for_review — flipping a draft to ready fires the full run (CAISSON-96).
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: "security-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deterministic layer: semgrep floor rules + p/security-audit, ruff flake8-bandit (support-bot),
  # trivy, osv-scanner, trufflehog (verified-only), Dockerfile digest gate (advisory). SEMGREP_JOBS=1
  # dodges the semgrep-core io_uring crash the fleet box can hit under parallelism.
  deterministic:
    # CAISSON-96 draft guard — drafts skip; the ready_for_review trigger runs the full scan.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      SEMGREP_JOBS: "1"
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # trufflehog git-history scan needs full history
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.2" # pinned (same pin as support-bot.yml; no drift)
      - name: install scanners (pinned versions, sha256-verified release artifacts)
        run: |
          # CAISSON-95: every scanner is version-pinned and digest-verified against
          # tools/security/versions.env — the old `curl | sh` installers fetched their script from
          # each project's MOVING main branch (an unauditable execution path), and the
          # `command -v || install` guards would have silently accepted ANY preinstalled version.
          # Installs are now unconditional (deterministic on a throwaway VM) and fail loud:
          # pipefail + sha256sum -c mean a bad download or tampered artifact reddens the job.
          set -eo pipefail
          source tools/security/versions.env
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/.local/bin"
          uv tool install "semgrep==${SEMGREP_VERSION}"
          uv tool install "ruff==${RUFF_VERSION}"
          tmp="$(mktemp -d)"
          curl -sSfL -o "$tmp/trivy.tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $tmp/trivy.tgz" | sha256sum -c -
          tar -C "$tmp" -xzf "$tmp/trivy.tgz" trivy
          install -m755 "$tmp/trivy" "$HOME/.local/bin/trivy"
          curl -sSfL -o "$tmp/trufflehog.tgz" "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  $tmp/trufflehog.tgz" | sha256sum -c -
          tar -C "$tmp" -xzf "$tmp/trufflehog.tgz" trufflehog
          install -m755 "$tmp/trufflehog" "$HOME/.local/bin/trufflehog"
          curl -sSfL -o "$tmp/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $tmp/osv-scanner" | sha256sum -c -
          install -m755 "$tmp/osv-scanner" "$HOME/.local/bin/osv-scanner"
          rm -rf "$tmp"
          # Re-assert every tool resolved — a missing tool must hard-fail the job, never silent-skip.
          for t in semgrep ruff trivy trufflehog osv-scanner; do
            command -v "$t" >/dev/null || { echo "::error::$t missing after install — scan layer would silently skip"; exit 1; }
          done
      - name: security scan (SAST + supply-chain)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # SARIF lands in $RUNNER_TEMP (OUT of the scanned tree) so `trivy fs .` never re-scans
          # semgrep's freshly-written SARIF. Set at step scope: the `runner` context is unavailable
          # in a job-level `env:`, and $RUNNER_TEMP is the shell form of it inside a step. The dir is
          # deliberately NON-hidden: actions/upload-artifact@v4 (>=4.4) excludes hidden files/dirs by
          # default, so a dot-dir uploaded empty ("No files were found") — the SARIF set evaporated.
          export SECURITY_OUT_DIR="$RUNNER_TEMP/security-out"
          # --strict-digests: Dockerfile digest-pin check (K-03) is ENFORCING — the ADR-0315
          # trigger (Renovate's first pin-wave merged) fired 2026-07-13; check-docker-digests.sh
          # proven green on main 2026-07-17 before the flip.
          bash tools/security/scan.sh --layer ci --strict-digests
      - name: upload SARIF artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-sarif-${{ github.sha }}
          path: ${{ runner.temp }}/security-out
          if-no-files-found: warn
          retention-days: 30

  # Semgrep PRO (interfile / cross-function taint). Dormant until SEMGREP_APP_TOKEN is set. The job
  # ALWAYS runs — a job-level `if` CANNOT reference the `secrets` context (doing so is a parse-time
  # "Unrecognized named-value: secrets" that invalidates the ENTIRE workflow file, killing the
  # deterministic job too) — but the single step below no-ops without a token. `semgrep ci`
  # self-authenticates from the token and pulls the org policy rules. SEMGREP_APP_TOKEN and
  # SEMGREP_RULES are mutually exclusive — never set both.
  semgrep-pro:
    # CAISSON-96 draft guard — drafts skip; the ready_for_review trigger runs the full scan.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # 45, not 20: this job's runtime swings hard. On 2026-07-27 it hit the old 20-minute ceiling on
    # `87202cd9` and then passed in ~3 minutes on an immediate re-run of the identical tree — a 7x
    # spread. A timed-out job reports as `cancelled`, which reads like someone aborted it rather
    # than a scan that never finished, and because this check is advisory nothing forced anyone to
    # look. The ceiling now sits above the observed worst case so the result means something.
    #
    # NOT changed here: the `-j 1` below (and its SEMGREP_JOBS twin). Single-threading is a
    # deliberate workaround for a semgrep-core io_uring crash, and that comment was written about
    # the self-hosted fleet box — this job runs on a 4-vCPU Blacksmith VM, so the workaround may not
    # apply and is likely the bulk of the runtime. Worth testing, but not worth guessing at inside a
    # launch deploy: removing a crash workaround on inference is how you trade a slow check for a
    # flaky one.
    timeout-minutes: 45
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      SEMGREP_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.2" # pinned (same pin as support-bot.yml; no drift)
      # One guarded step: skip cleanly (installing nothing) when the token is absent; otherwise
      # install the PINNED semgrep (CAISSON-95, tools/security/versions.env) and run the Pro
      # platform-policy scan (interfile/cross-function taint). The custom floor rules run in the
      # `deterministic` job (pattern rules need no Pro engine); add them to the Semgrep policy to
      # have them Pro-analyzed too.
      - name: semgrep ci (Pro cross-file taint) — dormant until SEMGREP_APP_TOKEN is set
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "SEMGREP_APP_TOKEN not set — Pro scan skipped (provision the repo secret to activate)"
            exit 0
          fi
          set -eo pipefail
          source tools/security/versions.env
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install "semgrep==${SEMGREP_VERSION}"
          semgrep ci -j 1

  # zizmor — GitHub Actions workflow auditor (Kickoff T task 2). ADVISORY for now: SARIF mode
  # always exits 0 (findings live in the SARIF, not the exit code), so this job can never block
  # a merge. Gate ramp: once the finding set is triaged to zero-or-ignored (zizmor.yml `ignore`
  # entries with rationale), drop `--no-exit-codes`, switch --format to plain, and add the job to
  # the required-check convention in scripts/release-readiness.ts — the repo is already SHA-pinned
  # throughout, so the steady-state finding rate should be near zero. Same pinned-install
  # discipline as the deterministic job: version + sha256 from tools/security/versions.env
  # (zizmor releases attach no checksums file — the pinned digest was verified by local download,
  # see versions.env comment).
  zizmor:
    # CAISSON-96 draft guard — drafts skip; the ready_for_review trigger runs the full scan.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install zizmor (pinned version, sha256-verified release artifact)
        run: |
          set -eo pipefail
          source tools/security/versions.env
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"
          curl -sSfL -o "$tmp/zizmor.tgz" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $tmp/zizmor.tgz" | sha256sum -c -
          tar -C "$tmp" -xzf "$tmp/zizmor.tgz"
          find "$tmp" -name zizmor -type f -exec install -m755 {} "$HOME/.local/bin/zizmor" \;
          rm -rf "$tmp"
          command -v "$HOME/.local/bin/zizmor" >/dev/null || { echo "::error::zizmor missing after install"; exit 1; }
      - name: zizmor audit (advisory — SARIF artifact, never blocks)
        env:
          # Online audits (impostor-commit, ref-confusion, stale-action-refs) need read access to
          # public commit graphs; the default token's `contents: read` suffices.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/zizmor-out"
          zizmor --persona=regular --format=sarif --no-exit-codes .github/workflows/ > "$RUNNER_TEMP/zizmor-out/zizmor.sarif"
          # Human-readable echo for the job log (advisory visibility without downloading the SARIF).
          zizmor --persona=regular --no-exit-codes .github/workflows/ || true
      - name: upload zizmor SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zizmor-sarif-${{ github.sha }}
          path: ${{ runner.temp }}/zizmor-out
          if-no-files-found: warn
          retention-days: 30
