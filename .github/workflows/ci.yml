name: ci
on:
  push:
    branches: [main, 'renovate/**']
  pull_request:
    # Explicit types (CAISSON-96): the GitHub defaults plus ready_for_review, so flipping a draft
    # to ready fires a fresh full run — the draft guard below suppressed the runs while drafting.
    types: [opened, synchronize, reopened, ready_for_review]

# ADR-0016 required checks. PGlite makes the integration + golden-file checks hermetic, so they
# run inside `test` on a stock runner (no Docker, no external service) rather than as separate
# jobs. The conceptual six — build · lint · test(unit) · test(integration) · standards-gate ·
# golden-file — map to the steps below; a Neon branch DB is the opt-in escape hatch via
# TEST_DATABASE_URL, never the default.
#
# The 4 REQUIRED STATUS CHECKS here (branch protection matches the job NAME, not the
# file) are standards-gate · check · registry-index · oscal-conformance. They stay UNCONDITIONAL for
# every non-draft trigger — no `paths:`, and the ONLY permitted `if:` is the draft guard
# (CAISSON-96): a path-skipped required job never reports and the PR blocks forever, but a DRAFT
# PR cannot merge anyway, and marking it ready_for_review (in the types list above) fires the full
# run before merge is possible. (oss-pivot PR1: the ADR-0422 site/demos Docker build smoke is
# retired — both apps are static exports with no container image.) Other jobs (eval · native-ext · token-drift) have
# moved to quality.yml, where path-filtering and main-only gating are safe because those jobs are
# not required checks. The full required set is therefore standards-gate · check · registry-index ·
# oscal-conformance (here) · deterministic (security-scan.yml); scripts/release-readiness.ts is the
# list. (oss-pivot PR2: the commercial fleet's deploy-railway/publish/mirror-sync/release-train/
# support-bot workflows and the required checks they carried are retired with the services they
# deployed.)
#
# RUNNER LINEAGE: pure-compute gates moved to Blacksmith VM-per-job runners on 2026-07-11
# (ADR-0326); credential-bearing publish/deploy-railway/mirror-sync/release-train jobs followed
# on 2026-07-19 (ADR-0365, with deploy-railway retained there under ADR-0367).
# The quality macOS leg left the self-hosted Mac mini for GitHub `macos-15` on 2026-07-30
# (ADR-0395 decision 3), then moved to Blacksmith on 2026-08-01 after GitHub billing failures.
# Estate R33/R257/R258 superseded that arrangement on 2026-09-10: the cockpit selected
# Ubicloud through CI_RUNNER_LINUX for Linux, including credential-bearing jobs, and the
# macOS leg returned to GitHub `macos-15`. Linux expressions retained `ubuntu-latest` as
# their unset-variable fallback. Variables remain cockpit-owned. Posture doc: docs/operations.md.

concurrency:
  # One in-flight run per PR / ref; a new push cancels the prior run so the limited fleet is not
  # tied up on superseded commits.
  group: "ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The standards gate (ADR-0021/0022) — the only registry ingress. Three layers, all block merge.
  standards-gate:
    # CAISSON-96 draft guard — the one permitted `if:` on a required check (header comment).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the changeset-presence gate below can diff against origin/main
          # (`changeset status --since=origin/main` resolves that ref from the fetched history).
          fetch-depth: 0
      # dependency-cruiser 18 requires node ^22||^24||>=26; the runner image ships Node 20
      # and `bunx depcruise` executes through the system node shebang.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # Layer 1 — SPDX/license authority: AGPL workspace + down-only + declarations +
      # checkExternalAgpl + checkManifestAgreement. Runs AFTER install: the gate's import graph
      # (typescript, zod) resolves only from node_modules — the former pre-install pass leaned on
      # Bun auto-install, which fails on `catalog:` deps in a clean checkout (2026-07-08 PR #179:
      # deterministic ENOENT on fresh runners; historical greens were runner-state accidents).
      - name: standards-gate (AGPL workspace + down-only + declarations + external-AGPL + manifest agreement)
        run: bun run tooling/standards-gate/src/cli.ts
      # Layer 2 — fast static provider-SDK signal (root .oxlintrc.json, ADR-0408).
      - name: oxlint import boundaries (provider-SDK, ADR-0011/0022)
        run: bun run lint:repo
      # The alpha-jsPlugins tripwire (ADR-0408). oxlint reports NOTHING when a JS plugin stops
      # loading, so a green lint leg above does not prove caisson-slop or the storybook rules ran.
      # This asserts three fixture files each still produce a finding; zero findings fails.
      - name: lint canary (jsPlugins silent-failure tripwire)
        run: bun run lint:canary
      # Layer 3 — real module graph: dynamic/transitive provider reach + base↔edition direction.
      - name: dependency-cruiser graph boundaries (ADR-0022)
        run: bun tooling/standards-gate/src/dependency-graph-guard.ts
      # Changeset-presence gate (ADR-0021/0111). Now that the packages are PUBLIC (0.1.0, ADR-0111),
      # every PR that changes a publishable package must carry a changeset, or the release/version
      # history drifts from the published versions. `changeset status --since=origin/main` exits 1
      # when there are changed packages but no new changeset (changesets `checking-for-changesets`).
      # SKIPPED on the main branch: main has no base to diff against and is the merge target, not a
      # release-gated PR — the actual ledger append/publish lives in publish-and-index (main-only).
      # ALSO skipped on release PRs (ADR-0208 republish): `changeset version` consumes the pending
      # changeset files by design, so a PR that DELETES changesets relative to origin/main is a
      # release PR — its package.json bumps are the consume output, not uncovered package changes.
      # A deletion is loud in review, so this cannot be gamed silently.
      - name: changeset presence (PR only — every package change needs a changeset)
        if: github.ref != 'refs/heads/main'
        run: |
          if git diff --name-only --diff-filter=D origin/main...HEAD -- '.changeset/*.md' | grep -q .; then
            echo "release PR (changesets consumed since origin/main) — presence gate skipped"
            exit 0
          fi
          bunx changeset status --since=origin/main

  check:
    # CAISSON-96 draft guard — the one permitted `if:` on a required check (header comment).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    # The heaviest job (38-pkg turbo tree incl. 6 Next.js builds + many in-process PGlite instances);
    # generous ceiling so a hung PGlite hook frees the runner rather than holding it to the 6h default.
    timeout-minutes: 30
    env:
      # Warm turbo cache lands here (cache step below). turbo reads TURBO_CACHE_DIR, so a cache hit
      # makes it skip unchanged tasks while still validating every task via input hashes (NOT
      # --affected — that would skip validation of a required gate).
      TURBO_CACHE_DIR: .turbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - name: cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: bun install --frozen-lockfile
      - name: format (oxfmt)
        run: bun run format:check
      - name: build · lint · typecheck · test (unit + PGlite integration + golden-file)
        # `turbo build/lint/typecheck/test` + the standards gate (== `bun run check`, run inline so CI can cap
        # concurrency). Golden fixtures are compared with BLESS unset, so any drift fails here.
        # --concurrency=50%: the integrated tree is 38 packages incl. 6 Next.js builds + many in-process
        # PGlite instances; at turbo's default fan-out they contend on the runner and a PGlite `beforeAll`
        # can exceed its hook timeout. Halving peak concurrency removes the starvation (local `bun run
        # check` stays full-speed). Tunable if the job runs long.
        run: bunx turbo run build lint typecheck test --no-daemon --concurrency=50% --continue=dependencies-successful && bun run gate
      - name: public-surface + browser-audit skill guards (outside the workspace)
        # The excerpt secret-scan + source-drift test and the preview reader contract are
        # load-bearing gates outside turbo — same class as the registry job's outside-turbo
        # `bun test registry/...`. (oss-pivot PR1 retired the Paddle marker-map validator with the
        # site price sheet it read.)
        # `.agents/` is outside the root `workspaces` globs too, so the browser-audit skill's
        # scripts have no turbo test task. They gained the reconciler that `tooling/browser-audit`
        # used to own (its package was folded in), so they run here or they run nowhere.
        # The `./` prefix is load-bearing: bun's discovery skips dot-directories, and a bare
        # `.agents/...` arg is read as a name FILTER (matches nothing, exit 1) rather than a path.
        #
        # `tooling/scripts/` and `scripts/` have NO package.json, so the `tooling/*` workspace glob
        # skips them and turbo never runs their tests — they are only covered by being named here.
        # ADR-0414 named railway-deploy + release-readiness because it changed both. The remaining
        # six (sot-check, dts-drift-check, tsgo-agreement, railway-env-sync, vault-parity-check,
        # aeo-probe) plus scripts/gen-shadcn-registry are now named too, closing the gap that
        # docs/state/outstanding-work.md tracked: 157 tests that ran in NO gate, including
        # sot-check — the repo's own drift detector.
        #
        # The prior caution ("unproven leg on a required check reds main") was discharged by
        # proving them first, not by overriding it. All seven were run with a SCRUBBED environment
        # (`env -i`, no ~/.gridwork/env) and pass 157/157, so none is green only because ambient
        # credentials supplied a value. None reaches the network or the live repo state:
        # railway-deploy and railway-env-sync use injected exec doubles and source-text assertions,
        # and sot-check builds SYNTHETIC throwaway git repos under mkdtempSync rather than reading
        # this working tree — which is why its live-repo DRIFT output does not follow it into CI.
        run: bun test tools/demo-excerpts tools/demo-preview scripts/release-readiness.test.ts scripts/gen-shadcn-registry.test.ts tooling/scripts/railway-deploy.test.ts tooling/scripts/sot-check.test.ts tooling/scripts/dts-drift-check.test.ts tooling/scripts/tsgo-agreement.test.ts tooling/scripts/railway-env-sync.test.ts tooling/scripts/vault-parity-check.test.ts tooling/scripts/aeo-probe.test.ts
      # Slow golden-file / testcontainers matrices land here once the compliance
      # edition (P2) has code — kept CI-only, never in the pre-commit hook.

  # registry/ tests also run under turbo (`bun run check`, the `check` job); this job is the
  # PROVENANCE proof: rebuilding from the git-tracked ledger must reproduce the committed
  # registry/index.json byte-for-byte (ADR-0021/0047). A hand-edited index (or a stale rebuild) fails
  # `git diff --exit-code`. This is the machine gate — it DETECTS tampering (goes red); PREVENTION
  # (blocking the merge) needs this job marked a required check + CODEOWNERS on a real handle +
  # branch protection (operator GitHub settings; forks board). The ledger APPEND step is publish.yml.
  registry-index:
    # CAISSON-96 draft guard — the one permitted `if:` on a required check (header comment).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: registry tests (schema · index builder)
        run: bun test registry/schema registry/scripts
      - name: index.json is a byte-identical rebuild from the ledger (proves CI-built)
        run: |
          bun registry/scripts/build-index.ts
          git diff --exit-code registry/index.json

  # The registry index (registry/index.json) is BUILT from the ledger by the registry-index job
  # above — never hand-appended (ADR-0021). Branch protection + CODEOWNERS on registry/index.json +
  # /registry/ledger.jsonl make CI the sole writer; the gateAttestation records provenance, it is not
  # the access gate. The PUBLISH step that appends a gated publish to the ledger lives in publish.yml.

  oscal-conformance:
    # NIST OSCAL v1.2.2 conformance gate (ADR-0179/0180): the JSON→XML→schema-validate round-trip via
    # oscal-cli (Java). Self-contained (installs a JDK + oscal-cli from Maven Central per run) — the
    # `check` job SKIPS these tests (oscal-cli is not installed there), so this is where the
    # ground-truth NIST schema validation actually runs. Validation is schema-only
    # (--disable-constraint-validation): constraint checks resolve the published import-ap URL, a
    # deploy-time concern, not export well-formedness. Extended by the oscal-spine SPEC (task 2,
    # ADR-0363/0364) with two direct JSON `oscal-cli validate` legs (no XML conversion needed for a
    # schema-only check): the generated caisson catalog, and the vendored NIST SP 800-53 rev5
    # catalog itself (a corruption check on the committed bytes — binding requirement 1).
    # CAISSON-96 draft guard — the one permitted `if:` on a required check (header comment).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: install oscal-cli (Maven Central distribution)
        run: |
          V=3.2.0
          curl -fsSL "https://repo1.maven.org/maven2/dev/metaschema/oscal/oscal-cli-enhanced/$V/oscal-cli-enhanced-$V-oscal-cli.zip" -o /tmp/oscal-cli.zip
          mkdir -p "$HOME/oscal-cli"
          unzip -oq /tmp/oscal-cli.zip -d "$HOME/oscal-cli"
          echo "$HOME/oscal-cli/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: JSON to XML to validate round-trip (SAR + POA&M at v1.2.2)
        run: |
          oscal-cli --version
          cd packages/oscal-spine && bun test src/evidence/oscal-export-xml.test.ts
      - name: generate + validate the caisson OSCAL catalog (oscal-spine SPEC task 2, v1.2.2)
        run: |
          cd packages/frameworks-pack
          bun run scripts/gen-catalog-for-ci.ts /tmp/caisson-catalog.oscal.json
          oscal-cli validate --disable-constraint-validation /tmp/caisson-catalog.oscal.json
      - name: validate the vendored NIST SP 800-53 rev5 catalog (corruption check, binding req 1)
        run: |
          oscal-cli validate --disable-constraint-validation packages/oscal-spine/src/vendor/nist-800-53-rev5-catalog.json
      - name: generate + validate the ISO/IEC 27001:2022 Statement of Applicability (component-definition, v1.2.2)
        run: |
          cd packages/frameworks-pack
          bun run scripts/gen-iso27001-soa-for-ci.ts /tmp/caisson-iso27001-soa.oscal.json
          oscal-cli validate --disable-constraint-validation /tmp/caisson-iso27001-soa.oscal.json
