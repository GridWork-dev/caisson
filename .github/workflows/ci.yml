name: ci
# Every pull request and every push to main. The final `ci` job is the one required status check:
# it passes only when every job above it passed (or, for the two jobs gated by event, was skipped
# by that gate). PGlite keeps the integration and golden-file tests hermetic, so nothing here needs
# Docker, a database service, or a secret.
on:
  push:
    branches: [main]
  pull_request:
  # release.yml dispatches this on the version PR's branch: a PR opened with GITHUB_TOKEN gets no
  # pull_request run of its own.
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The standards gate and the module-boundary checks (ADR-0021/0022).
  standards-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The changeset-presence step diffs against origin/main.
          fetch-depth: 0
          persist-credentials: false
      # dependency-cruiser needs Node >= 22; the runner image ships Node 20.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: standards gate (licenses, down-only deps, declarations, manifest agreement)
        run: bun run tooling/standards-gate/src/cli.ts
      - name: oxlint import boundaries (provider SDKs, ADR-0011/0022)
        run: bun run lint:repo
      # oxlint reports nothing when a JS plugin fails to load; three fixtures must each still
      # produce a finding.
      - name: lint canary
        run: bun run lint:canary
      - name: dependency-cruiser graph boundaries (ADR-0022)
        run: bun tooling/standards-gate/src/dependency-graph-guard.ts
      # Every PR that changes a package carries a changeset. A PR that deletes changesets is the
      # version PR consuming them, so the check does not apply there.
      - name: changeset presence
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only --diff-filter=D origin/main...HEAD -- '.changeset/*.md' | grep -q .; then
            echo "version PR (changesets consumed) - presence check skipped"
            exit 0
          fi
          bunx changeset status --since=origin/main

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # turbo still hashes every task's inputs on a cache hit; it only skips unchanged work.
      TURBO_CACHE_DIR: .turbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: bun install --frozen-lockfile
      - name: format
        run: bun run format:check
      # `bun run check`, inline so CI can halve turbo's fan-out: the tree runs many in-process
      # PGlite instances and several Next builds, which starve each other at full concurrency.
      - name: build, lint, typecheck, test, standards gate
        run: bunx turbo run build lint typecheck test --no-daemon --concurrency=50% --continue=dependencies-successful && bun run gate
      # Test files outside any workspace package, which turbo never runs.
      - name: tests outside the workspaces
        run: bun test tools/demo-excerpts scripts/gen-shadcn-registry.test.ts tooling/scripts/dts-drift-check.test.ts tooling/scripts/tsgo-agreement.test.ts tooling/scripts/build-evidence-pack.test.ts tooling/scripts/sync-generator-template-pins.test.ts tooling/scripts/package-contents.test.ts
      - name: deterministic evals against their committed baselines (ADR-0062)
        run: bunx turbo run eval --no-daemon
      - name: tokens.css is a byte-identical rebuild of the TS tokens (ADR-0101)
        run: |
          bun run packages/ui/scripts/gen-tokens-css.ts
          git diff --exit-code packages/ui/styles/tokens.css
      - name: component manifest is a byte-identical rebuild of the UI source
        run: bun run --filter @caisson-sh/ui check:manifest
      - name: UI anti-slop pre-pass (allowlist-filtered)
        run: bun run apps/site/scripts/anti-slop.ts
      # The same pack the release publishes, minus the upload: proves every package packs and no
      # packed manifest keeps a workspace: range.
      - name: pack every published package
        run: bun tooling/scripts/publish-packages.ts --dry-run

  # NIST OSCAL v1.2.2 conformance through oscal-cli (Java), which the check job does not install
  # (ADR-0179/0180). Schema-only validation: constraint checks resolve published import URLs.
  oscal-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: install oscal-cli (Maven Central distribution)
        run: |
          V=3.2.0
          curl -fsSL "https://repo1.maven.org/maven2/dev/metaschema/oscal/oscal-cli-enhanced/$V/oscal-cli-enhanced-$V-oscal-cli.zip" -o /tmp/oscal-cli.zip
          mkdir -p "$HOME/oscal-cli"
          unzip -oq /tmp/oscal-cli.zip -d "$HOME/oscal-cli"
          echo "$HOME/oscal-cli/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: JSON to XML to validate round-trip (SAR + POA&M)
        run: |
          oscal-cli --version
          cd packages/oscal-spine && bun test src/evidence/oscal-export-xml.test.ts
      - name: generate and validate the caisson OSCAL catalog
        run: |
          cd packages/frameworks-pack
          bun run scripts/gen-catalog-for-ci.ts /tmp/caisson-catalog.oscal.json
          oscal-cli validate --disable-constraint-validation /tmp/caisson-catalog.oscal.json
      - name: validate the vendored NIST SP 800-53 rev5 catalog (corruption check)
        run: oscal-cli validate --disable-constraint-validation packages/oscal-spine/src/vendor/nist-800-53-rev5-catalog.json
      - name: generate and validate the ISO/IEC 27001:2022 Statement of Applicability
        run: |
          cd packages/frameworks-pack
          bun run scripts/gen-iso27001-soa-for-ci.ts /tmp/caisson-iso27001-soa.oscal.json
          oscal-cli validate --disable-constraint-validation /tmp/caisson-iso27001-soa.oscal.json

  # local-store loads a platform-specific sqlite-vec extension (.so on Linux, .dylib on macOS).
  # The check job covers Linux on every PR; this matrix adds macOS on main.
  native-ext:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos]
    # runs-on stays out of the matrix so the check names stay `native-ext (linux|macos)`.
    runs-on: ${{ matrix.platform == 'macos' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # Apple's system SQLite disables extension loading; store.ts uses Homebrew's.
      - name: ensure extension-capable SQLite (macOS)
        if: runner.os == 'macOS'
        run: |
          [ -f "$(brew --prefix 2>/dev/null)/opt/sqlite/lib/libsqlite3.dylib" ] || brew install sqlite
      - name: local-store native sqlite-vec extension on ${{ matrix.platform }}
        run: bun test packages/local-store/src

  # Playwright over a production build of the site on this commit.
  site-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # From apps/site so bunx resolves the pinned playwright, whose browser revision the tests use.
      - name: install playwright chromium
        working-directory: apps/site
        run: bunx playwright install --with-deps chromium
      - name: site end-to-end suite
        run: bunx turbo run test:e2e --filter=@caisson-sh/site --no-daemon

  # The build-provenance evidence pack (ADR-0275): standards-gate output, module catalog and
  # catalog test run for this commit, as one downloadable artifact.
  evidence-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: assemble the evidence pack
        run: bun tooling/scripts/build-evidence-pack.ts
      - name: upload evidence pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-pack-${{ github.sha }}
          path: evidence-pack/pack
          if-no-files-found: error
          retention-days: 90

  # Declaration drift across a TypeScript compiler bump (ADR-0369). Runs only when a PR changes
  # the pinned compiler (tooling/tsconfig/package.json): emits .d.ts for every package with the
  # base and head compilers and fails on any byte difference.
  dts-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: did this PR change the compiler pin?
        id: pin
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE_REF...HEAD" -- tooling/tsconfig/package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tooling/tsconfig/package.json unchanged - no compiler bump to compare"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pin.outputs.changed == 'true'
        uses: ./.github/actions/setup-bun
      - if: steps.pin.outputs.changed == 'true'
        run: bun install --frozen-lockfile
      - name: resolve the base branch's tsc-native version
        if: steps.pin.outputs.changed == 'true'
        id: base-pin
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          spec=$(git show "origin/$BASE_REF:tooling/tsconfig/package.json" | bun -e '
            const pkg = JSON.parse(await Bun.stdin.text());
            const spec = pkg.dependencies?.["tsc-native"];
            if (!spec) { console.error("base tooling/tsconfig/package.json has no tsc-native dependency"); process.exit(1); }
            console.log(spec);
          ')
          echo "version=${spec##*@}" >> "$GITHUB_OUTPUT"
      - name: install the base compiler outside the repo
        if: steps.pin.outputs.changed == 'true'
        env:
          BASE_VERSION: ${{ steps.base-pin.outputs.version }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/base-native"
          cd "$RUNNER_TEMP/base-native"
          echo '{}' > package.json
          bun add "typescript@$BASE_VERSION"
      - name: resolve this PR's tsc-native binary
        if: steps.pin.outputs.changed == 'true'
        id: head-bin
        run: |
          set -e
          bin=$(find -L tooling/tsconfig/node_modules -path "*/tsc-native/bin/tsc" -print -quit)
          [ -n "$bin" ] || { echo "tsc-native not found under tooling/tsconfig/node_modules" >&2; exit 1; }
          echo "path=$bin" >> "$GITHUB_OUTPUT"
      - name: build the packages' dependency closure (declaration emit needs built deps)
        if: steps.pin.outputs.changed == 'true'
        run: bunx turbo run build --filter "{./packages/*}..."
      - name: compare declaration output
        if: steps.pin.outputs.changed == 'true'
        env:
          TSC_BASE: ${{ runner.temp }}/base-native/node_modules/.bin/tsc
          TSC_HEAD: ${{ steps.head-bin.outputs.path }}
        run: bun tooling/scripts/dts-drift-check.ts

  # The single required status check.
  ci:
    if: always()
    needs: [standards-gate, check, oscal-conformance, native-ext, site-e2e, evidence-pack, dts-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job passed (native-ext and dts-drift may be skipped by their event gate)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -c 'to_entries | map({(.key): .value.result}) | add'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or ((.key == "native-ext" or .key == "dts-drift") and .value.result == "skipped"))' > /dev/null
