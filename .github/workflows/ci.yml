name: ci
on:
  push:
    branches: [main]
  pull_request:

# ADR-0016 required checks. PGlite makes the integration + golden-file checks hermetic, so they
# run inside `test` on a stock runner (no Docker, no external service) rather than as separate
# jobs. The conceptual six — build · lint · test(unit) · test(integration) · standards-gate ·
# golden-file — map to the steps below; a Neon branch DB is the opt-in escape hatch via
# TEST_DATABASE_URL, never the default.
jobs:
  # The standards gate (ADR-0021/0022) — the only registry ingress. Three layers, all block merge.
  standards-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Layer 1a — SPDX/license authority, fs-only pass. Runs BEFORE install so AGPL-workspace +
      # down-only + declarations are checked even if the workspace install is broken.
      - name: standards-gate (pre-install — AGPL workspace + down-only + declarations)
        run: bun run tooling/standards-gate/src/cli.ts
      - run: bun install --frozen-lockfile
      # Layer 1b — re-run POST-install: this is where checkExternalAgpl + checkManifestAgreement
      # actually execute (they need node_modules / zod). Without this second run they silently skip.
      - name: standards-gate (post-install — external-AGPL + manifest↔package.json agreement)
        run: bun run tooling/standards-gate/src/cli.ts
      # Layer 2 — fast static provider-SDK signal (needs root eslint.config.js → @caisson/eslint-config).
      - name: eslint import boundaries (provider-SDK, ADR-0011/0022)
        run: bunx eslint .
      # Layer 3 — real module graph: dynamic/transitive provider reach + base↔edition direction.
      - name: dependency-cruiser graph boundaries (ADR-0022)
        run: bunx depcruise packages apps tooling --config .dependency-cruiser.cjs
      # Changeset presence is a PUBLISH-time gate (ADR-0021) — it lands with the registry
      # publish-and-index job at P5 (commented below). Pre-publish, every package is private
      # (0.0.0) so there is nothing to release-gate yet.

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: format (prettier)
        run: bun run format:check
      - name: build · lint · test (unit + PGlite integration + golden-file)
        # `turbo build/lint/test` + the standards gate (== `bun run check`, run inline so CI can cap
        # concurrency). Golden fixtures are compared with BLESS unset, so any drift fails here.
        # --concurrency=50%: the integrated tree is 38 packages incl. 5 Next.js builds + many in-process
        # PGlite instances; at turbo's default fan-out they contend on the runner and a PGlite `beforeAll`
        # can exceed its hook timeout. Halving peak concurrency removes the starvation (local `bun run
        # check` stays full-speed). Tunable if the job runs long.
        run: bunx turbo run build lint test --no-daemon --concurrency=50% && bun run gate
      # Slow golden-file / testcontainers matrices land here once the compliance
      # edition (P2) has code — kept CI-only, never in the pre-commit hook.

  # The eval gate (ADR-0062). A DISTINCT turbo `eval` task — separate from `test` — that runs the
  # committed eval suite against the committed JSON baseline (regression-vs-baseline, BLESS-style).
  # It is offline + deterministic: model-graded scorers replay committed cassettes, so there is no
  # live provider/model/network call and no secret in CI (SPEC TM6).
  #
  # ADR-0072: this is a MONOREPO-ONLY job. It is NEVER injected into a generated buyer repo as a
  # required CI check — `create-caisson` must not emit this job. A buyer owns their own eval cadence
  # and baseline; gating their merges on OUR regression baseline is wrong. The eval task ships in the
  # library for the buyer to opt into, but it is not one of the required buyer-repo CI checks.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: eval gate (regression vs committed baseline, BLESS unset — offline, cassette-replayed)
        run: bun run eval

  # Exit-gate clause 6 (P4a local-ai): @caisson/local-store loads a PLATFORM-SPECIFIC native
  # extension — `db.loadExtension(sqliteVec.getLoadablePath())` in packages/local-store/src/store.ts
  # resolves a `.so` on Linux and a `.dylib` on macOS. The `check`/`standards-gate` jobs run on
  # ubuntu only, so the macOS native binary path would otherwise ship unexercised. This matrix runs
  # the local-store suite (vec0 + FTS5 + RRF hybrid retrieval) on BOTH runners; a missing/broken
  # platform extension fails CI here. `fail-fast: false` so a break on one OS never masks the other.
  native-ext:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # macOS ships a system SQLite with extension loading DISABLED (Apple build). store.ts points
      # bun:sqlite at Homebrew's extension-capable SQLite via Database.setCustomSQLite; ensure it is
      # installed so that path exists on the runner. No-op effect on Linux (step is macOS-gated).
      - name: ensure extension-capable SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite
      - name: local-store native sqlite-vec ext (vec0 + FTS5 + RRF) on ${{ matrix.os }}
        run: bun test packages/local-store/src

  # registry/ tests also run under turbo (`bun run check`, the `check` job); this job is the
  # PROVENANCE proof: rebuilding from the git-tracked ledger must reproduce the committed
  # registry/index.json byte-for-byte (ADR-0021/0047). A hand-edited index (or a stale rebuild) fails
  # `git diff --exit-code`. This is the machine gate — it DETECTS tampering (goes red); PREVENTION
  # (blocking the merge) needs this job marked a required check + CODEOWNERS on a real handle +
  # branch protection (operator GitHub settings; forks board). The ledger APPEND step is P5 (below).
  registry-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: registry tests (schema · index builder · worker seam)
        run: bun test registry/schema registry/scripts registry/worker
      - name: index.json is a byte-identical rebuild from the ledger (proves CI-built)
        run: |
          bun registry/scripts/build-index.ts
          git diff --exit-code registry/index.json

  # tokens.css is GENERATED from the @caisson/ui TS token objects (ADR-0099 design-quality gate #1).
  # This job proves the committed sheet is a byte-identical rebuild: editing a token without running
  # `bun run gen:tokens`, or hand-editing tokens.css, fails `git diff --exit-code`. Mirrors the
  # registry-index provenance gate; tokens.css is .prettierignore'd so the generator is sole authority.
  token-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: tokens.css is a byte-identical rebuild from the TS tokens (ADR-0099 #1)
        run: |
          bun run packages/ui/scripts/gen-tokens-css.ts
          git diff --exit-code packages/ui/styles/tokens.css

  # The registry index (registry/index.json) is BUILT from the ledger by the registry-index job
  # above — never hand-appended (ADR-0021). Branch protection + CODEOWNERS on registry/index.json +
  # /registry/ledger.jsonl make CI the sole writer; the gateAttestation records provenance, it is not
  # the access gate. The PUBLISH step that appends a gated publish to the ledger is wired below (P5).

  # publish-and-index: gates on check + standards-gate + registry-index; main-only (ADR-0021).
  # Auth: built-in GITHUB_TOKEN ephemeral (written to ~/.npmrc at runtime; NO stored PAT, NO
  # NODE_AUTH_TOKEN repository secret — ADR-0069). Changesets publish is guarded by
  # CAISSON_PUBLISH_DRY_RUN (default "true") — the job scaffolds the full flow without pushing
  # packages; set the env var to "false" operator-side to go live.
  #
  # P5-25: GHEC provenance attestation = DECLINED. Lightweight provenance is already embedded in
  #        each LedgerEntry's gateAttestation field ("<run-id>@<commit-sha>"); a full SLSA/GHEC
  #        attestation blob is deferred to a post-P5 hardening pass.
  # P5-26: Worker-deploy = DEFERRED. Cloudflare Worker registry endpoint not yet live; this job
  #        commits the rebuilt index.json which the Worker will consume once deployed.
  publish-and-index:
    needs: [check, standards-gate, registry-index]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # Operator publish gate (ADR-0069). Default is dry-run; set "false" to go live.
      CAISSON_PUBLISH_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so changesets can read tags; built-in GITHUB_TOKEN for commit-back
          # (not a stored PAT — the ephemeral token does not trigger downstream CI runs).
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # Write the GitHub Packages registry URL + ephemeral GITHUB_TOKEN to ~/.npmrc.
      # This is the built-in short-lived token, NOT a stored PAT or NODE_AUTH_TOKEN secret (ADR-0069).
      - name: configure GitHub Packages registry (ephemeral GITHUB_TOKEN — no stored PAT)
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
      # Changeset version + publish, guarded by CAISSON_PUBLISH_DRY_RUN (default "true").
      # In dry-run mode both are skipped; the rest of the job still validates the CI flow.
      - name: changeset version + publish (dry-run by default — set CAISSON_PUBLISH_DRY_RUN=false to go live)
        run: |
          if [ "${CAISSON_PUBLISH_DRY_RUN}" != "false" ]; then
            echo "[publish-and-index] dry-run: changeset version + publish skipped (CAISSON_PUBLISH_DRY_RUN=${CAISSON_PUBLISH_DRY_RUN})"
          else
            bunx changeset version
            bunx changeset publish
          fi
      # Scan workspace manifest.ts files → append newly-published versions to the ledger →
      # rebuild registry/index.json. In dry-run mode the script reports without writing;
      # the subsequent git diff finds no changes and no commit is created.
      - name: append ledger entries + rebuild registry/index.json
        run: |
          bun registry/scripts/ci-publish-step.ts \
            --run-id "${{ github.run_id }}" \
            --sha "${{ github.sha }}" \
            --published-at "$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')" \
            --dry-run "${CAISSON_PUBLISH_DRY_RUN}"
      # Commit ONLY registry/ledger.jsonl + registry/index.json back to main.
      # In dry-run mode the diff is empty → no commit. git pull --rebase before push guards
      # against concurrent writes (rare but safe to handle).
      - name: commit registry files to main (ledger.jsonl + index.json only)
        run: |
          if git diff --quiet registry/ledger.jsonl registry/index.json; then
            echo "[publish-and-index] registry files unchanged — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add registry/ledger.jsonl registry/index.json
            git commit -m "chore(registry): append ledger + rebuild index.json [ci-publish]"
            git pull --rebase origin main
            git push
          fi
