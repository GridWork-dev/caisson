name: publish scan proof
on:
  pull_request:
    paths:
      - .github/workflows/publish-scan-proof.yml
      - deploy/prepare-build.sh
      - deploy/prepare-build.test.ts
      - apps/**/Dockerfile
      - services/**/Dockerfile
      - deploy/Dockerfile.migrate
permissions:
  contents: read
concurrency:
  group: publish-scan-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: select
        run: |
          python3 -c 'import json; m=json.load(open("deploy/services.json")); print("matrix="+json.dumps({"include":[{"service":k,"dockerfile":v["dockerfile"],"context":v["build_context"]} for k,v in sorted((m["services"]|m["jobs"]).items())]}))' >> "$GITHUB_OUTPUT"
  publish:
    name: publish scan proof (${{ matrix.service }})
    needs: select
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      IMAGE: caisson-scan-proof:${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: assert version inputs
        env:
          BUN_VERSION_FILE: ${{ vars.BUN_VERSION_FILE }}
          NODE_VERSION_FILE: ${{ vars.NODE_VERSION_FILE }}
        run: test -n "$BUN_VERSION_FILE" && test -n "$NODE_VERSION_FILE"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ vars.BUN_VERSION_FILE }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ vars.NODE_VERSION_FILE }}
      - run: bun install --frozen-lockfile
      - name: gates
        run: bash deploy/gates.sh
      - name: prepare build context
        run: bash deploy/prepare-build.sh
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: build local image (no publish)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            GIT_SHA=${{ github.sha }}
      - name: measure image and disk
        run: |
          set -euo pipefail
          mkdir -p scan-proof
          docker image inspect "$IMAGE" --format '{"sizeBytes":{{.Size}}}' | tee scan-proof/image-size.json
          df -B1 / "$RUNNER_TEMP" | tee scan-proof/disk-before.txt
          docker system df -v > scan-proof/docker-disk.txt
      - name: vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Deliberately retain the previously failing export in the proof: it uses
          # more disk than the remote production scan, without registry credentials.
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: scan-proof/trivy.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
      - name: final disk readback
        if: always()
        run: |
          mkdir -p scan-proof
          df -B1 / "$RUNNER_TEMP" | tee scan-proof/disk-after.txt
      - name: upload scan proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scan-proof-${{ matrix.service }}
          path: scan-proof/
          if-no-files-found: error
