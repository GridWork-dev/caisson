name: deploy-railway
# Project token RAILWAY_TOKEN is a repo secret scoped to caisson-prod (not yet set → this job is
# inert until the operator adds it). Build-on-Railway via the service's
# RAILWAY_DOCKERFILE_PATH=apps/site/Dockerfile env var (configured on the Railway service, not
# here). This job touches NO DNS and NO CF Access; it coexists with deploy-site.yml (Cloudflare
# Pages) until the cutover, at which point deploy-site.yml retires.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/**"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-railway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest # holds the prod Railway token → hosted, like deploy-site
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: install Railway CLI
        run: bun add -g @railway/cli
      - name: deploy apps/site to Railway (build-on-Railway, repo-root context)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service caisson-site --ci
