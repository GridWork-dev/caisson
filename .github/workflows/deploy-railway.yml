name: deploy-railway
# Automated redeploy of the unified apps/site Next app (marketing + docs + /dashboard) to Railway.
# Build-on-Railway via the service's RAILWAY_DOCKERFILE_PATH=apps/site/Dockerfile env var (set on the
# Railway service, not here). Touches NO DNS and NO CF Access.
#
# STAYS INERT UNTIL ARMED: the project token RAILWAY_TOKEN (scoped to caisson-prod) is not yet a repo
# secret. The guard step below reads it and SKIPS every real step when it is absent, so a push-triggered
# run is a GREEN no-op — it never attempts a deploy and never reddens main. The operator ARMS it by
# adding the RAILWAY_TOKEN secret at the cutover (deploy-runbook C2); it then self-enables on the next
# push. ONE EXCEPTION: a caller that passes `require_armed=true` (the release train's leg 4) gets a hard
# FAILURE instead of the green skip, because a train that reports a deploy it never performed is worse
# than a red leg.
# The static-export deploy-site.yml (Cloudflare Pages) it once coexisted with is already retired (its
# CI half); deleting the Pages project itself is the DEPLOY-class teardown step C7.
on:
  push:
    branches: [main]
    # These paths gate the AUTOMATIC path only, which deploys admin + site. `services/license/**`
    # is deliberately absent: the license step is dispatch-only (it runs migrations — see the step).
    # `apps/admin/**` is present because this job deploys admin and an admin-only change previously
    # did not trigger it at all, so admin could drift behind main until some other tree changed.
    paths:
      - "apps/site/**"
      - "apps/admin/**"
      - "packages/**"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "The git ref to deploy (checked out, ancestry-verified, archived clean)"
        required: false
        default: ""
      require_armed:
        description: "Set 'true' to FAIL when RAILWAY_TOKEN is absent instead of skipping green (the release train passes this)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: deploy-railway
  cancel-in-progress: false

jobs:
  deploy:
    # Blacksmith-only fleet (operator directive 2026-07-19, ADR-0365 lock-1 provision): the last
    # hosted job followed the rest after the free-minute exhaustion made it a permanent zero-step
    # red. Operator lock ADR-0367: this job STAYS on Blacksmith even once RAILWAY_TOKEN arms —
    # VM-per-job isolation + a Railway-scoped revocable deploy credential is the accepted posture.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      # Inert-until-armed guard: `secrets` can't be referenced in a job/step `if:`, so map RAILWAY_TOKEN
      # to an env here and publish an `armed` output. Absent token → armed=false → every step below skips
      # → the job succeeds as a no-op. This is what keeps main GREEN before the operator provisions the
      # token; it does NOT arm the deploy (no token is added here — it self-arms when the secret is set).
      - name: arm check (RAILWAY_TOKEN present?)
        id: guard
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          REQUIRE_ARMED: ${{ github.event.inputs.require_armed || 'false' }}
        run: |
          if [ -n "${RAILWAY_TOKEN}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          elif [ "${REQUIRE_ARMED}" = "true" ]; then
            # Called by an ARMED release train. A green skip here is a false green of the worst
            # kind: the train reports every leg passed while the site still serves the previous
            # image, and the only thing that catches it is someone reading the live page. Leg 1
            # (registry publish) already refuses to no-op with missing credentials for exactly
            # this reason; this is that rule applied to the deploy leg.
            echo "::error::deploy-railway was called with require_armed=true but RAILWAY_TOKEN is not set — refusing to report a green deploy that shipped nothing. Arm the secret, or deploy from the operator box with tooling/scripts/railway-deploy.ts."
            exit 1
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy-railway is inert — RAILWAY_TOKEN not set; skipping deploy (operator arms at cutover C2)"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.guard.outputs.armed == 'true'
        with:
          # Full history: tooling/scripts/railway-deploy.ts resolves --ref and checks its ancestry
          # against origin/main itself, so the checkout needs every commit + branch it might touch.
          fetch-depth: 0
      # A manual dispatch can leave `ref` blank; default to the SHA that triggered this run (the
      # push SHA, or the workflow_dispatch ref's tip) — mirrors publish.yml's tag-defaulting.
      - name: resolve deploy ref
        if: steps.guard.outputs.armed == 'true'
        id: resolve-ref
        env:
          RAW_REF: ${{ github.event.inputs.ref }}
        run: |
          echo "ref=${RAW_REF:-${{ github.sha }}}" >> "$GITHUB_OUTPUT"
      - name: fetch origin/main (ancestry check needs it)
        if: steps.guard.outputs.armed == 'true'
        run: git fetch origin main --quiet
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.armed == 'true'
        with:
          bun-version: "1.3.14"
      - name: install Railway CLI
        if: steps.guard.outputs.armed == 'true'
        run: bun add -g @railway/cli@5.23.3
      # Immutable-input deploy: resolves the ref to a commit, refuses one that isn't an ancestor
      # of origin/main, stages a CLEAN `git archive` tree (no dirty working-tree state, no
      # untracked cruft, git's own normalized file modes), runs `railway up` from that staging
      # dir, and appends a single-use receipt — never a bare `railway up` off the live checkout.
      #
      # ORDER IS LOAD-BEARING: admin before site. admin is the internal-proof bearer VERIFIER and
      # site is its ISSUER. The standing rule is that the verifier must already understand every
      # format the live issuer can send, which only verifier-first guarantees: a new issuer against
      # an old verifier is a hard 401 on every buyer's evidence dashboard (the pre-F3 verifier regex
      # `^Bearer ([0-9a-f]{64})$` could not match a `<unix-seconds>.<hmac>` credential at all).
      # Found by the v2026.07.30 release audit: until then this job deployed ONLY caisson-site, so
      # no admin change had ever ridden the train and admin silently drifted behind main.
      # The dual-format acceptance that made the F3 rollout itself safe is GONE as of 2026-07-31
      # (see internal-proof-auth.ts) — that was a one-release transition, not the rule. The rule is
      # this ordering.
      # services/license goes FIRST — it is the backend both of the others call, and it is one of
      # the surfaces that bakes registry/index.json into its image. Leaving it out is what let the
      # v2026.07.30 train publish a new index and move repo, Worker and admin onto it while license
      # kept serving the previous one (`4810e38157c1` vs `dc5ee000aebf`, caught by the parity probe
      # 2026-07-31 and closed by a hand redeploy). Every release did that; now leg 4 covers it.
      #
      # DISPATCH-ONLY, deliberately. license is the ONLY one of the three with a preDeployCommand
      # (`bun apps/site/lib/deploy-migrate.ts` — see services/license/railway.toml), so including it
      # in the automatic push-triggered path would run schema migrations against production on any
      # merge touching packages/**, unattended. A workflow_dispatch is an explicit act: the release
      # train's leg 4, or an operator running it by hand. Push-triggered runs keep deploying admin
      # and site only, exactly as before.
      - name: deploy services/license to Railway (backend + index-baking surface; dispatch only)
        if: steps.guard.outputs.armed == 'true' && github.event_name == 'workflow_dispatch'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOY_REF: ${{ steps.resolve-ref.outputs.ref }}
        run: |
          bun tooling/scripts/railway-deploy.ts \
            --service caisson-license \
            --ref "$DEPLOY_REF"
      - name: deploy apps/admin to Railway (verifier — MUST precede the issuer)
        if: steps.guard.outputs.armed == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOY_REF: ${{ steps.resolve-ref.outputs.ref }}
        run: |
          bun tooling/scripts/railway-deploy.ts \
            --service caisson-admin \
            --ref "$DEPLOY_REF"
      - name: deploy apps/site to Railway (immutable-input, receipt-gated)
        if: steps.guard.outputs.armed == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOY_REF: ${{ steps.resolve-ref.outputs.ref }}
        run: |
          bun tooling/scripts/railway-deploy.ts \
            --service caisson-site \
            --ref "$DEPLOY_REF"
