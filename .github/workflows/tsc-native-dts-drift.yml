name: tsc-native-dts-drift
# Bump-gated declaration-drift guard (ADR-0369). Replaces the retired weekly toolchain-advisory
# measurement lane's cutover purpose with a narrower PR check: whenever a PR changes
# tooling/tsconfig/package.json (i.e. bumps the tsc-native alias — npm:typescript@X.Y.Z), emit
# .d.ts for every packages/* tsc package with BOTH the base branch's pinned compiler and this
# PR's pinned compiler and byte-compare the trees. Fails the job on ANY drift — this is the
# buyer-era .d.ts stability gate: a maintainer accepts an intentional drift by regenerating
# baselines (and re-versioning any affected sold packages) in the same PR, not by silencing this
# check. NOT a required status check (branch protection is discipline-only on this private
# free-plan repo, per CLAUDE.md's PR-review-gate section) — but it blocks merge in spirit exactly
# like the four required checks.
on:
  pull_request:
    paths:
      - "tooling/tsconfig/package.json"
      - "tooling/scripts/dts-drift-check.ts"
      - "tooling/scripts/dts-drift-check.test.ts"
      - "tooling/scripts/tsgo-agreement.ts"
      - "tooling/scripts/tsgo-agreement.test.ts"
      - ".github/workflows/tsc-native-dts-drift.yml"

permissions:
  contents: read

concurrency:
  group: "tsc-native-dts-drift-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  dts-drift:
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    # Compiling every packages/* tsc package TWICE (base pin + head pin) for declaration-only
    # emit; generous headroom over the tsgo-agreement lane's own 45m ceiling since this job also
    # does a second full `bun install` for the isolated base-compiler dir.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so `git show origin/<base_ref>:...` below can resolve the base branch's
          # tooling/tsconfig/package.json without a separate fetch.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: test the declaration-drift helpers
        run: bun test tooling/scripts/dts-drift-check.test.ts tooling/scripts/tsgo-agreement.test.ts
      - name: resolve the base branch's tsc-native pin
        id: base-pin
        run: |
          set -e
          BASE_MANIFEST=$(git show "origin/${{ github.base_ref }}:tooling/tsconfig/package.json")
          BASE_SPEC=$(echo "$BASE_MANIFEST" | bun -e '
            const pkg = JSON.parse(await Bun.stdin.text());
            const spec = pkg.dependencies?.["tsc-native"];
            if (!spec) { console.error("tooling/tsconfig/package.json (base branch) has no tsc-native dependency"); process.exit(1); }
            console.log(spec);
          ')
          # Alias form is always npm:typescript@X.Y.Z — the version is everything after the last "@".
          BASE_VERSION="${BASE_SPEC##*@}"
          echo "base tsc-native spec: $BASE_SPEC (version $BASE_VERSION)"
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: install the base compiler (pinned, isolated from the repo's own deps)
        # A throwaway package.json under $RUNNER_TEMP, never the repo tree — same idiom the
        # retired toolchain-advisory.yml used for its native-compiler install (git history).
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/base-native"
          cd "$RUNNER_TEMP/base-native"
          echo '{}' > package.json
          bun add "typescript@${{ steps.base-pin.outputs.version }}"
      - name: resolve this PR's tsc-native bin
        id: head-bin
        # tsc-native is a devDep of @caisson-sh/tsconfig only, not hoisted to the repo-root
        # node_modules under bun's workspace layout — bun installs it as a symlink into its
        # content-addressed store, so `-L` (follow symlinks) is required. Scoped to
        # tooling/tsconfig/node_modules specifically (not a repo-wide find): other packages can
        # carry their OWN transitive tsc-native copy (e.g. through @caisson-sh/testing), and an
        # unscoped find can silently grab the wrong one in directory-traversal order.
        run: |
          set -e
          BIN=$(find -L tooling/tsconfig/node_modules -path "*/tsc-native/bin/tsc" -print -quit)
          if [ -z "$BIN" ]; then
            echo "tsc-native bin not found under tooling/tsconfig/node_modules after bun install — was tooling/tsconfig/package.json's dependency renamed?" >&2
            exit 1
          fi
          echo "head tsc-native bin: $BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
      # Declaration emit needs BUILT workspace deps (~50 of the candidates cannot emit in a fresh
      # checkout — the harness incapability that made lane A's first fail-closed flip
      # red-by-construction, PR #412). The script runs this same closure build itself; this
      # explicit step exists so a dep-build failure gets its own step-level attribution and the
      # in-script run becomes a turbo cache no-op.
      - name: build the packages/* dependency closure (declaration emit needs built deps)
        run: bunx turbo run build --filter "{./packages/*}..."
      - name: run the drift check (fails the job on any .d.ts byte drift or emit failure)
        shell: bash
        env:
          TSC_BASE: ${{ runner.temp }}/base-native/node_modules/.bin/tsc
          TSC_HEAD: ${{ steps.head-bin.outputs.path }}
        run: bun tooling/scripts/dts-drift-check.ts | tee dts-drift-report.md
      - name: upload the report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dts-drift-report
          path: dts-drift-report.md
          if-no-files-found: warn
          retention-days: 30
