name: nist-catalog-watch
# Weekly ADVISORY watch for the oscal-spine SPEC's F5 lock (ADR-0364, operator override of the
# manual-v1 recommendation): does `usnistgov/oscal-content`'s vendored path have a newer commit
# than the pinned SHA (packages/oscal-spine/src/vendor/nist-catalog-pin.ts)? If so, structurally
# diff its control-id set against the currently-committed catalog and flag which
# `nist80053Crosswalk` rows' provenance just went stale. Report-only — modeled on the
# toolchain-advisory lane: `vendor-nist-catalog.ts --refetch` does the actual work, always exits 0,
# and this is NOT a required check. No credential beyond a public, unauthenticated GitHub read
# (api.github.com + raw.githubusercontent.com — the same already-sanctioned egress the vendoring
# script itself uses); the Binding-requirement-2 WRITE path (an actual re-vendor) stays the
# operator-triggered `vendor-nist-catalog.ts` (no flag), never this job.
on:
  workflow_dispatch: {}
  schedule:
    # Sunday 05:11 UTC — same low-traffic window as toolchain-advisory, offset a few minutes so the
    # two weekly advisory jobs don't pile onto the same runner minute.
    - cron: "11 5 * * 0"

permissions:
  contents: read

concurrency:
  group: nist-catalog-watch
  cancel-in-progress: true

jobs:
  refetch-diff:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: install workspace deps
        run: bun install --frozen-lockfile
      - name: refetch + structurally diff against the pinned catalog (report-only, always exits 0)
        run: |
          cd packages/oscal-spine
          bun scripts/vendor-nist-catalog.ts --refetch | tee nist-catalog-watch-report.md
      - name: upload the report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nist-catalog-watch-report
          path: packages/oscal-spine/nist-catalog-watch-report.md
          if-no-files-found: warn
          retention-days: 30
