name: version-pr
# The ADR-0325 version PR — the ONLY place changesets are consumed. Operator-dispatched; authors
# a branch carrying the WHOLE release source truth as one reviewable PR: `changeset version`
# (package.json bumps + CHANGELOGs + consumed .changeset/*.md) and a refreshed bun.lock.
#
# Flow (ADR-0325, amends ADR-0318/0223 mechanics):
#   1. operator dispatches THIS workflow → it opens the version PR
#   2. operator merges it → push-to-main CI (the required checks) runs on the merge commit
#   3. operator publishes a GitHub Release whose tag targets EXACTLY that merge commit
#
# The initial branch push uses the ephemeral GITHUB_TOKEN, so it does NOT trigger pull_request CI
# (GitHub anti-loop rule); close + reopen is the operator path to force the full pre-merge CI signal
# on the version commit.
#
# The "never in-branch `changeset version`" rule (ADR-0321) is unchanged — this automation-authored
# PR is the gated consumption point; it is still never a feature-branch act.
#
# (oss-pivot PR2: the ledger append + index.json rebuild + tarballs.json hash-row step, and the
# pull_request_target `refresh-version-tarballs` job that kept those rows in sync on later pushes,
# are retired with registry/tarballs.json and the R2/tarball publish pipeline they served.)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-pr-${{ github.event.pull_request.number || 'dispatch' }}
  cancel-in-progress: false

jobs:
  version-pr:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # Blacksmith per ADR-0365 (the 2026-07-19 fleet-only sweep; write perms accepted on VM-per-job runners).
    # Write privilege belongs on a clean hosted runner, not third-party compute.
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: release # ADR-0327 rider 2: the release-family boundary (definition-first; free-plan protection rules can't enforce yet)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so changesets can read tags and the ledger diff is honest.
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # Loud guard: dispatching with nothing to version is an operator mistake, not a no-op.
      - name: require pending changesets
        run: |
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)"
          if [ "$pending" -eq 0 ]; then
            echo "::error::no pending .changeset/*.md — nothing to version. Land changesets first."
            exit 1
          fi
          echo "[version-pr] $pending pending changeset(s)"
      - name: changeset version (consume)
        run: bunx changeset version
      # The generated component manifest embeds @caisson/ui's package version. Refresh it after
      # Changesets bumps package.json so the version PR cannot ship stale design metadata.
      - name: regenerate version-coupled design manifest
        run: bun run --filter @caisson/ui gen:manifest
      # Template pins and their generated starter golden carry workspace versions too.
      # Refresh before packing so this version PR records the final generator bytes.
      - name: refresh generator template pins and Next starter golden
        run: |
          set -euo pipefail
          bun tooling/scripts/sync-generator-template-pins.ts
          (
            cd packages/cli
            BLESS=1 bun test ./src/generate.test.ts -t "framework=next composes the Next.js starter"
          )
      # The bumps change workspace package versions recorded in bun.lock — refresh it here (NOT
      # frozen) so the merge commit passes every `bun install --frozen-lockfile` gate downstream.
      - name: refresh bun.lock for the bumped versions
        run: bun install
      # Commit everything the consume produced and open the PR. Pathspecs cover EVERY workspace
      # (apps/services/registry/tooling get dependent bumps too) + bun.lock; the loud leftovers
      # check fails with filenames if a future write-site slips past the pathspec.
      - name: open the version PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="release/version-${{ github.run_id }}"
          git switch -c "$branch"
          git add -A -- \
            ':(glob)**/package.json' ':(glob)**/CHANGELOG.md' '.changeset' bun.lock \
            packages/ds-manifest/src/base-manifest.json \
            packages/cli/src/__golden__/generated-fileset-framework-next.json
          if git diff --cached --quiet; then
            echo "::error::changeset version produced no changes — nothing to PR"
            exit 1
          fi
          if ! git diff --quiet; then
            echo "::error::tracked changes left unstaged after the pathspec add:"
            git status --short
            exit 1
          fi
          git commit -m "chore(release): version PR - consume changesets [version-pr]"
          git push -u origin "$branch"
          gh pr create \
            --title "chore(release): version PR ($(date -u '+%Y-%m-%d'), run ${{ github.run_id }})" \
            --body "$(printf '%s\n' \
              "Automation-authored version PR (ADR-0325). Contains the complete release source truth:" \
              "" \
              "- \`changeset version\` consume: package.json bumps + CHANGELOGs + drained \`.changeset/\`" \
              "- refreshed \`bun.lock\`" \
              "" \
              "Next steps (release runbook):" \
              "1. Merge this PR (push-to-main CI runs the required checks on the merge commit; this PR shows no checks because GITHUB_TOKEN pushes never trigger CI — close/reopen to force a pre-merge run)." \
              "2. Publish a GitHub Release whose tag targets EXACTLY the merge commit." \
              )"
