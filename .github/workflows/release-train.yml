name: release-train
# The ADR-0318 release train (R1–R4), reworked commit-addressable by ADR-0325. Publishing a
# GitHub Release is THE trigger (R1) — its tag MUST target the merged version-PR commit
# (version-pr.yml authored it; push-to-main CI proved it green). Everything rides it (R2):
# registry tarball publish → public-mirror sync → mirror npm publish → site redeploy, in that
# order, each leg a dispatch of the existing workflow that already owns the capability (no
# duplicated publish logic). Legs 1 and 2 receive the release tag so they act on EXACTLY the
# tagged bytes — one SHA anchors source, ledger, tarballs, mirror, and evidence. The readiness
# job (R3, scripts/release-readiness.ts) runs first and any red check — including tag-not-on-main
# — stops the train before it touches an external surface.
#
# STAYS DORMANT UNTIL ARMED: the propagation job runs only when the repo VARIABLE
# RELEASE_TRAIN_ARMED is "true" (a variable, not a secret, so it can gate a job-level `if:`
# directly — no guard-step dance needed). Until the operator sets it, a published release runs
# readiness (useful signal) and skips propagation. The individual legs additionally keep their
# own inert-until-armed guards (MIRROR_PUSH_TOKEN, RAILWAY_TOKEN, R2 keys), so arming the train
# without arming a leg still no-ops that leg green.
#
# The retired per-push triggers: publish.yml (dry-run on every main push) and mirror-sync.yml
# (snapshot per main push) no longer fire on push — the train is their scheduler now; both keep
# workflow_dispatch as the manual lever.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: release readiness (R3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release-readiness.ts \
            --tag "${{ github.event.release.tag_name }}" \
            --sha "${{ github.sha }}"

  propagate:
    needs: readiness
    # Dormant until the operator sets the RELEASE_TRAIN_ARMED repo variable to "true" (ADR-0318:
    # the train ships dormant; W3 arming is an operator act). Skipped-when-unarmed keeps the
    # workflow green.
    if: vars.RELEASE_TRAIN_ARMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release # ADR-0327 rider 2 (definition-first; free-plan protection rules can't enforce yet)
    permissions:
      contents: read
      actions: write # dispatch same-repo workflows (publish.yml, mirror-sync.yml, deploy-railway.yml)
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Dispatch a workflow and block until its run concludes; fail the train on a red leg.
      # `gh workflow run` returns no run id, so poll for the newest run created after dispatch
      # (concurrency: single-operator repo + per-workflow concurrency groups make this safe).
      - name: leg helper
        run: |
          cat > /tmp/dispatch-and-wait.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"; workflow="$2"; shift 2
          before="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run "$workflow" -R "$repo" "$@"
          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id="$(gh run list -R "$repo" --workflow "$workflow" --created ">$before" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then echo "::error::$repo/$workflow: dispatched run never appeared"; exit 1; fi
          echo "watching $repo/$workflow run $run_id"
          gh run watch "$run_id" -R "$repo" --exit-status --interval 30
          EOF
          chmod +x /tmp/dispatch-and-wait.sh
      - name: leg 1 — registry publish (verify + upload EXACTLY the tagged bytes, LIVE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /tmp/dispatch-and-wait.sh "${{ github.repository }}" publish.yml \
            -f dry_run=false -f tag="${{ github.event.release.tag_name }}"
      - name: leg 2 — public mirror sync (exported at the release tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /tmp/dispatch-and-wait.sh "${{ github.repository }}" mirror-sync.yml \
            -f ref="${{ github.event.release.tag_name }}"
      - name: leg 3 — mirror npm publish (caisson-sh/caisson-oss)
        env:
          # MIRROR_PUSH_TOKEN is the fine-grained PAT on caisson-sh/caisson-oss (contents +
          # actions/workflows rw) — the same credential mirror-sync pushes with.
          GH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: /tmp/dispatch-and-wait.sh caisson-sh/caisson-oss publish.yml -f confirm=publish
      - name: leg 4 — site redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/dispatch-and-wait.sh "${{ github.repository }}" deploy-railway.yml
