name: lighthouse-ci
# CWV + a11y audit (ADR-0079 §6, enforcement hardened by ADR-0309).
#
# RE-ARMED 2026-07-09 (ADR-0309): collection retargeted at the live Railway origin per the
# deploy-runbook C.4/C.6 re-arm note — the old `staticDistDir: "out"` collection died with the
# ADR-0114 flip to `output: 'standalone'`. Assertions are now ERROR-level and the job no longer
# sets continue-on-error: a budget miss is a red run (ADR-0309: "a red run, not a shrug").
#
# Stays manual-dispatch ONLY — deliberately NOT a required PR check (ADR-0309 rejected the
# required-gate option: no new flaky gate the week before launch). Dispatch it against prod after
# a deploy as wave evidence; override `url` to point at any origin.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Origin to audit (no trailing slash)"
        required: false
        default: "https://caisson.sh"

permissions:
  contents: read

jobs:
  lighthouse:
    # STAYS GitHub-hosted by design: needs a headless Chrome (the fleet runner image ships no
    # browser). Collection hits the live origin, so no site build is needed here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to the repo's packageManager bun (was `latest` — drift risk).
          bun-version: "1.3.14"

      - name: run Lighthouse CI against the live origin
        working-directory: apps/site
        # inputs.url rides an env var, never direct ${{ }} interpolation into the shell —
        # expression-injection hardening (dispatch is write-gated, but the idiom costs nothing).
        run: >
          bunx @lhci/cli@0.15.1 autorun
          --collect.url="${AUDIT_URL}/"
          --collect.url="${AUDIT_URL}/marketplace"
        env:
          AUDIT_URL: ${{ inputs.url || 'https://caisson.sh' }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
