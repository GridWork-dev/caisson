name: lighthouse-ci
# CWV + a11y baseline audit (ADR-0079 §6).
#
# GATED to manual dispatch ONLY (2026-06-30, ADR-0114): this audit ran against the static `out/`
# export (lighthouserc.json `staticDistDir: "out"`), which no longer exists — apps/site flipped to
# `output: 'standalone'` (Node server on Railway), so `bun run build` emits `.next/standalone`, not
# `out/`. With no static dir to collect AND the Railway origin not yet deployed, an auto-run on every
# apps/site/ PR would only error on the missing `out/`. Dropping the `pull_request` trigger keeps it
# off the PR entirely (no failing/annotating check) while preserving the config + assertions.
#
# RE-ARM (post-cutover — deploy-runbook C.4/C.6): retarget the audit at the live Railway origin —
# swap lighthouserc.json `collect.staticDistDir` for `collect.url` + `startServerCommand` (or a
# `LIGHTHOUSE_URL` secret) — then restore a `pull_request`/`schedule` trigger. The file is kept, not
# deleted, per deploy-runbook C.2 ("keep lighthouse.yml — retarget Node build").
#
# Non-blocking regardless: all assertions are "warn" level and the job sets continue-on-error: true.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    # STAYS GitHub-hosted by design: needs a headless Chrome (the fleet runner image ships no browser)
    # and uploads to temporary-public-storage with LHCI_GITHUB_APP_TOKEN. Non-blocking (warn-only), so
    # lowest stakes staying hosted; moving it would require a Chrome-equipped fleet image.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to the repo's packageManager bun (was `latest` — drift risk).
          bun-version: "1.3.14"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: build site (static export)
        working-directory: apps/site
        run: bun run build

      - name: run Lighthouse CI
        run: bunx @lhci/cli@0.15.1 autorun
        working-directory: apps/site
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
