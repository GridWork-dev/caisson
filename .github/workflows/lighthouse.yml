name: lighthouse-ci
# CWV + a11y baseline audit on PRs (ADR-0079 §6).
# Non-blocking: all assertions use "warn" level — this job is informational until scores
# are stable enough to harden to "error". Set continue-on-error: true so a CWV regression
# surfaces as a visible annotation without blocking the merge.
on:
  pull_request:
    paths:
      - "apps/site/**"
      - "packages/ui/**"

jobs:
  lighthouse:
    # STAYS GitHub-hosted by design: needs a headless Chrome (the fleet runner image ships no browser)
    # and uploads to temporary-public-storage with LHCI_GITHUB_APP_TOKEN. Non-blocking (warn-only), so
    # lowest stakes staying hosted; moving it would require a Chrome-equipped fleet image.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the repo's packageManager bun (was `latest` — drift risk).
          bun-version: "1.3.14"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: build site (static export)
        working-directory: apps/site
        run: bun run build

      - name: run Lighthouse CI
        run: bunx @lhci/cli@latest autorun
        working-directory: apps/site
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
