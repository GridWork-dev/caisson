name: support-bot

# Python gate for services/support-bot (the repo's only Python surface — ADR-0105). Runs on the same
# Blacksmith VM-per-job lane as the TS gates (ADR-0326, docs/operations.md); setup-uv installs uv and
# uv fetches Python 3.12 + the locked deps inside the throwaway container, so no interpreter needs to
# pre-exist on the runner.
#
# REQUIRED since ADR-0414 — `support-bot` joins the set: check · standards-gate · registry-index ·
# oscal-conformance · deterministic · support-bot. The promotion is sequenced BEFORE this service
# gained an automated Railway deploy in the same ADR: an advisory gate in front of an automatic
# deploy means a red bot lands in production and nothing blocks it. As with the other five,
# "required" is discipline on this free-plan private repo (no enforced branch protection): the
# convention is enforced by scripts/release-readiness.ts (REQUIRED_CHECKS) and review practice.
#
# THE PATHS FILTER IS GONE, and its removal is what makes the promotion sound. ci.yml's header
# states the rule: a required job stays UNCONDITIONAL, because a path-skipped required job never
# reports and the PR blocks forever. release-readiness.ts enforces the same thing from the other
# side — it counts a check that never reported as `missing`, so a path-scoped required check would
# red the readiness gate on every release whose diff happened not to touch the bot. The only
# permitted `if:` is the CAISSON-96 draft guard below, exactly as in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
    # Defaults plus ready_for_review — flipping a draft to ready fires the full run (CAISSON-96).
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: "support-bot-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  support-bot:
    # CAISSON-96 draft guard — drafts skip; the ready_for_review trigger runs the gate.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/support-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.2" # pinned (matches the operator box; no drift on a persistent fleet)
          enable-cache: true
          cache-dependency-glob: services/support-bot/uv.lock
      # bun is the only JS runtime on the fleet container (no system node; pyright-python's bundled
      # Node fails — it links libatomic, which the minimal container lacks and can't apt-install). bun
      # runs the pyright npm package directly, so the typecheck step needs no Node at all.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: sync (frozen — lockfile is the source of truth)
        run: uv sync --frozen
      - name: lint + format check (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      # pyright reads [tool.pyright] from pyproject.toml (venv = .venv, created by `uv sync` above) to
      # resolve imports; bunx runs it under bun. Pinned to match the dev-group pyright.
      - name: typecheck (pyright via bun — no Node dependency)
        run: bunx pyright@1.1.411
      - name: test (pytest — hermetic; no Discord/OpenRouter/Postgres)
        run: uv run pytest -q
      # The offline eval gate (CAISSON-100): the RagPipeline's injection/PII/grounding invariants run
      # through the real pipeline with the hermetic doubles and regression-check against the committed
      # __evals__/baseline.json. A DISTINCT step (like the TS `eval` turbo task) so an eval regression
      # reads separately from a unit-test failure. BLESS is unset here — CI only ever compares, never
      # rewrites the baseline (that is the operator's `BLESS=1 uv run pytest -m eval` re-bless path).
      - name: eval gate (regression vs committed baseline, BLESS unset — offline, hermetic doubles)
        run: uv run pytest -m eval -q
