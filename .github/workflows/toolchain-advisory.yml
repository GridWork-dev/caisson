name: toolchain-advisory
# Weekly MEASUREMENT lane for the PF2-1 tsgo/native-TypeScript cutover decision: does the GA
# native Go compiler (typescript@7.0.2, npm-published as a bin-only package — tsc + platform
# binaries, no JS compiler API) agree with the repo's classic tsc (typescript@6.0.3, catalog) on
# --noEmit type-checking across every workspace package, what's the wall-clock delta, and — for
# packages/kernel, the cutover gate for sold packages — is its emitted .d.ts byte-identical
# between the two compilers. tooling/scripts/tsgo-agreement.ts does the actual work and always
# exits 0 (advisory): the data feeds the decision, it never blocks anything.
#
# NOT on pull_request: this compiles every discovered package TWICE (repo tsc + native tsc) plus
# a dedicated kernel declaration-emit pass — a PR-gate cost for a lane that produces a dashboard,
# not a verdict. workflow_dispatch covers on-demand re-measurement (e.g. right after a version
# bump); the weekly schedule keeps the trend line current without per-PR cost.
on:
  workflow_dispatch: {}
  schedule:
    # Sunday 04:23 UTC — low-traffic hour, off the top-of-hour pile-up other repos' cron jobs hit.
    - cron: "23 4 * * 0"

env:
  # The ONE place the native compiler version is pinned. Bump this deliberately, not
  # incidentally — every bump changes what's being measured, so re-read the agreement data (this
  # workflow's artifact) after each bump rather than assuming last week's verdict still holds.
  TYPESCRIPT_NATIVE_VERSION: "7.0.2"

permissions:
  contents: read

concurrency:
  group: toolchain-advisory
  cancel-in-progress: true

jobs:
  tsgo-agreement:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Compiling ~60 packages twice (repo tsc + native tsc) plus the kernel dts-diff leg; 45m gives
    # headroom without masking a genuine hang (a real run measures single-digit minutes).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: install workspace deps (repo tsc lives here)
        run: bun install --frozen-lockfile
      - name: install the native compiler (pinned, isolated from the repo's own deps)
        # A throwaway package.json under $RUNNER_TEMP, never the repo tree — the native compiler
        # is a measurement subject, not a dependency of caisson itself, so it must never land in
        # the repo's lockfile/node_modules.
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/native"
          cd "$RUNNER_TEMP/native"
          echo '{}' > package.json
          bun add "typescript@${TYPESCRIPT_NATIVE_VERSION}"
      - name: run tsgo agreement measurement
        env:
          NATIVE_TSC: ${{ runner.temp }}/native/node_modules/.bin/tsc
        run: |
          # tsgo-agreement.ts always exits 0 (advisory) and also appends its markdown to
          # $GITHUB_STEP_SUMMARY on its own; `tee` additionally captures it to a file so the same
          # report survives as a downloadable artifact past the ephemeral step-summary UI.
          bun tooling/scripts/tsgo-agreement.ts --dts-diff-kernel | tee tsgo-agreement-report.md
      - name: upload the report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tsgo-agreement-report
          path: tsgo-agreement-report.md
          if-no-files-found: warn
