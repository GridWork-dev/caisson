name: quality
# The NON-required quality gates — split out of ci.yml so they can be path-filtered without
# risking a required check (branch protection only watches standards-gate/check/registry-index,
# which stay unconditional in ci.yml). On PULL REQUESTS each job may skip when its package tree
# is untouched: skip just means "nothing to validate," never "merge blocked." On MAIN PUSHES
# every job runs unconditionally (operator call 2026-07-09) — main is the full-truth signal, so
# a docs-only commit still exercises eval, token-drift, and native-ext. The `!cancelled()` in
# each job's `if` replaces the implicit success() gate so a failed/flaky `changes` job cannot
# skip the push path — on PRs a failed `changes` still skips (its outputs read empty).
#
# DRAFT PRs run nothing (CAISSON-96): the guard sits on `changes` + the two unconditioned jobs
# (knip, evidence-pack); the path-conditioned jobs inherit it — a skipped `changes` leaves their
# outputs empty, and `github.event_name == 'push'` is false on a PR, so their `if` reads false.
on:
  push:
    branches: [main]
  pull_request:
    # Defaults plus ready_for_review — flipping a draft to ready fires the full run (CAISSON-96).
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: "quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detects which package trees changed so the jobs below can skip when irrelevant. `pull-requests:
  # read` is required by dorny/paths-filter for the pull_request event (it reads the changed-file
  # list via the GitHub REST API); for push it falls back to git against the pre-push commit, which
  # works against the default shallow checkout below (the action fetches additional history itself).
  changes:
    # CAISSON-96 draft guard (header comment) — skipping this job also skips every path-conditioned job.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eval: ${{ steps.filter.outputs.eval }}
      ui: ${{ steps.filter.outputs.ui }}
      local-store: ${{ steps.filter.outputs.local-store }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            eval:
              - 'packages/**'
              - 'apps/**'
              - 'services/intel/**'
            ui:
              - 'packages/ui/**'
              - 'packages/ds-manifest/src/base-manifest.json'
            local-store:
              - 'packages/local-store/**'
            site:
              - 'apps/site/**'
              - 'packages/ui/**'
              - 'packages/ui-pro/**'

  # The deterministic eval gate (ADR-0062). A DISTINCT turbo `eval` task — separate from `test` —
  # runs every non-intel committed suite against its JSON baseline (regression-vs-baseline,
  # BLESS-style). Intel moved to the credentialed live-model lane below (CAISSON-102).
  #
  # ADR-0072: this is a MONOREPO-ONLY job. It is NEVER injected into a generated buyer repo as a
  # required CI check — `create-caisson` must not emit this job. A buyer owns their own eval cadence
  # and baseline; gating their merges on OUR regression baseline is wrong. The eval task ships in the
  # library for the buyer to opt into, but it is not one of the required buyer-repo CI checks.
  #
  # NOT a required check → safe to path-skip on PRs when packages/**, apps/**, and services/intel/**
  # are untouched; always runs on main pushes.
  eval:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.eval == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: deterministic eval gate (BLESS unset — intel live lane excluded)
        run: bunx turbo run eval --no-daemon --filter='!@caisson/service-intel'

  # CAISSON-102: raw watcher cassettes still replay deterministically, but brief composition and the
  # actionability judge are live OpenRouter calls. Credential-bearing work stays GitHub-hosted and
  # MAIN-PUSH-ONLY: PR-controlled code never receives the provider key. Once a green-only cassette
  # set is armed, a missing/invalid model response fails closed (never replays a verdict).
  intel-eval:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: intel replay + live brief quality gate (BLESS unset)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun run --cwd services/intel eval

  # tokens.css is GENERATED from the @caisson/ui TS token objects (ADR-0101 design-quality gate #1).
  # This job proves the committed sheet is a byte-identical rebuild: editing a token without running
  # `bun run gen:tokens`, or hand-editing tokens.css, fails `git diff --exit-code`. Mirrors the
  # registry-index provenance gate; tokens.css is .prettierignore'd so the generator is sole authority.
  #
  # NOT a required check → safe to path-skip on PRs when packages/ui/** is untouched; always
  # runs on main pushes.
  token-drift:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.ui == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: tokens.css is a byte-identical rebuild from the TS tokens (ADR-0101 #1)
        run: |
          bun run packages/ui/scripts/gen-tokens-css.ts
          git diff --exit-code packages/ui/styles/tokens.css
      - name: component manifest is a byte-identical rebuild from the UI source
        run: bun run --filter @caisson/ui check:manifest

  # Unused-dep / unused-export gate (repo-improvement-program row #7). ADVISORY lane, same
  # promotion rule as the `sot` gate: detect and report, never block. `--no-exit-code` means a
  # non-zero knip finding count never fails this job — read the job log for what it flagged.
  # Repo-wide (not path-filtered): knip's cross-workspace unused-export analysis needs the whole
  # tree regardless of which package changed.
  knip:
    # CAISSON-96 draft guard — unconditioned job, needs its own (header comment).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: knip unused-dep / unused-export report (advisory, never blocks)
        run: bun run knip -- --no-exit-code

  # Anti-slop UI pre-pass (Kickoff-S task 5 / ADR-0334 quality leg): the vendored 36-rule
  # deterministic UI-slop detector (impeccable catalog — $0, no LLM, no network) over the site
  # pages + the design-system kit, filtered by the reviewed allowlist
  # (apps/site/scripts/anti-slop-allow.json — every accepted finding carries its reason). A NEW
  # finding fails THIS job only. Dependency-free (node stdlib via bun), so no install step.
  #
  # NOT a required check → safe to path-skip on PRs when the site tree is untouched; always
  # runs on main pushes.
  anti-slop:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.site == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: anti-slop deterministic UI-slop pre-pass (allowlist-filtered)
        run: bun run apps/site/scripts/anti-slop.ts

  # Exit-gate clause 6 (P4a local-ai): @caisson/local-store loads a PLATFORM-SPECIFIC native
  # extension — `db.loadExtension(sqliteVec.getLoadablePath())` in packages/local-store/src/store.ts
  # resolves a `.so` on Linux and a `.dylib` on macOS. The `check`/`standards-gate` jobs run on
  # ubuntu only, so the macOS native binary path would otherwise ship unexercised. This matrix runs
  # the local-store suite (vec0 + FTS5 + RRF hybrid retrieval) on BOTH runners; a missing/broken
  # platform extension fails CI here. `fail-fast: false` so a break on one OS never masks the other.
  # Linux leg → the fleet's amd64 scale set (exercises the sqlite-vec `.so`). macOS leg →
  # GitHub-hosted `macos-15` (Apple Silicon — ADR-0395 decision 3, 2026-07-30): moved OFF the
  # self-hosted Mac mini (`[self-hosted, gw-macos-arm64]`) because a single offline machine could
  # wedge every `main` push indefinitely while reporting nothing distinguishable from "still
  # running" — exactly what happened to d7f7d834's quality run, `queued` 18 hours while every other
  # job in it passed. `macos-15` is pinned (not `macos-latest`, which floats to whatever image is
  # current) to match this file's pinning style elsewhere. The sqlite step below is check-first and
  # now does the real work on every run: a hosted runner starts clean each time, so it never
  # inherits a host-wide Homebrew SQLite the way the fleet box did.
  #
  # NOT a required check → safe to path-skip on PRs when packages/local-store/** is untouched;
  # always runs on main pushes.
  native-ext:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.local-store == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: blacksmith-4vcpu-ubuntu-2404
          - platform: macos
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      # Workspace deps (@caisson/kernel, @caisson/testing) must be linked before bun test resolves
      # them. This step was missing since the job landed: the self-hosted linux leg masked it with a
      # persistent workspace's stale node_modules, and the hosted macOS leg had simply never fired
      # (path-filtered) until the ADR-0208 consume touched packages/local-store/package.json.
      - run: bun install --frozen-lockfile
      # macOS ships a system SQLite with extension loading DISABLED (Apple build). store.ts points
      # bun:sqlite at Homebrew's extension-capable SQLite via Database.setCustomSQLite; ensure it is
      # installed so that path exists on the runner. `macos-15` ships Homebrew preinstalled but not
      # this formula, and starts clean every run (no persistent host-wide install to inherit), so
      # this actually runs `brew install` every invocation now — check-first just skips the
      # redundant install if a future runner image ships the formula by default. No-op on Linux
      # (step is macOS-gated).
      - name: ensure extension-capable SQLite (macOS)
        if: runner.os == 'macOS'
        run: |
          [ -f "$(brew --prefix 2>/dev/null)/opt/sqlite/lib/libsqlite3.dylib" ] || brew install sqlite
      - name: local-store native sqlite-vec ext (vec0 + FTS5 + RRF) on ${{ matrix.platform }}
        run: bun test packages/local-store/src

  # The deterministic browser-audit graduation suite (ADR-0323 D2, CAISSON-93): the four P1
  # clean replays from outputs/browser-audit/2026-07-10-full-01/ pinned as local Playwright
  # tests over a `next build` + `next start` on THIS commit — no live origin, no CF Access, no
  # secrets. Hosted ubuntu runner, not the fleet: the fleet runner image ships no browser (the
  # same constraint that keeps lighthouse.yml hosted); Playwright installs its own Chromium here.
  #
  # NOT a required check → safe to path-skip on PRs when the site tree (and the UI kits it
  # renders) is untouched; always runs on main pushes.
  site-e2e:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.site == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: install playwright chromium
        # Run from the workspace so bunx resolves apps/site's pinned playwright
        # (bun keeps workspace bins in apps/site/node_modules/.bin, not root) —
        # a bare root bunx silently fetches npm-latest, whose browser revision
        # drifts from the pin the e2e actually launches (2026-07-24 breakage).
        working-directory: apps/site
        run: bunx playwright install --with-deps chromium
      - name: deterministic browser-audit graduation suite (build + serve + assert)
        run: bunx turbo run test:e2e --filter=@caisson/site --no-daemon

  # The CI build-provenance evidence pack (ADR-0275). Aggregates the evidence CI already produces —
  # the standards-gate output, the registry index byte-identity proof, and the registry test run —
  # into ONE downloadable, manifest'd artifact for a security reviewer's due diligence (feeds the
  # ADR-0272 evidence page). UNCONDITIONAL (no path-filter): the pack is the provenance for THIS
  # commit, so it must build on every push and pull request. NOT a required check — a failure here
  # means the evidence could not be assembled, never that a merge is blocked (this repo has no
  # enforced branch protection). The heavy proofs (the full turbo suite, the Java oscal-cli NIST
  # validation) are their own jobs at this same SHA and are REFERENCED by the manifest, not re-run.
  evidence-pack:
    # CAISSON-96 draft guard — "every push and pull request" above means every NON-DRAFT one; the
    # ready_for_review run assembles the pack before a merge is possible.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      # Post-install: the standards-gate CLI's external-AGPL + manifest-agreement layers need node_modules.
      - run: bun install --frozen-lockfile
      - name: assemble the build-evidence pack (runs the cheap producers + writes the manifest)
        run: bun registry/scripts/build-evidence-pack.ts
      - name: upload evidence pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-pack-${{ github.sha }}
          path: evidence-pack/pack
          if-no-files-found: error
          retention-days: 90
