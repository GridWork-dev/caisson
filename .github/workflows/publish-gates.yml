name: publish gates
on:
  pull_request:
    paths:
      - .github/workflows/publish-gates.yml
      - .github/workflows/publish-image.yml
      - deploy/gates.sh
      - deploy/gates.test.ts

permissions:
  contents: read

concurrency:
  group: publish-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish-gates:
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: assert version inputs
        env:
          BUN_VERSION_FILE: ${{ vars.BUN_VERSION_FILE }}
          NODE_VERSION_FILE: ${{ vars.NODE_VERSION_FILE }}
        run: test -n "$BUN_VERSION_FILE" && test -n "$NODE_VERSION_FILE"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ vars.BUN_VERSION_FILE }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ vars.NODE_VERSION_FILE }}
      - run: bun install --frozen-lockfile
      # Same cold gate and runner as publish-image; no auth, image push or deployment.
      - name: gates
        run: |
          set -euo pipefail
          (
            while true; do
              date -u +%FT%TZ
              awk '/MemTotal:|MemAvailable:|SwapTotal:|SwapFree:/ { print }' /proc/meminfo
              if [ -r /proc/pressure/memory ]; then cat /proc/pressure/memory; fi
              if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi
              sleep 5
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          bash deploy/gates.sh
