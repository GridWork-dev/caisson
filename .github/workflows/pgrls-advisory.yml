name: pgrls-advisory
# pgrls (github.com/pgrls/pgrls, PyPI 0.48.2, MIT, Python>=3.11) — a static analyzer + Z3 prover for
# Postgres Row-Level Security. Kickoff T task 9. ADVISORY ONLY, same ramp convention as the zizmor
# job in security-scan.yml: pgrls is a BETA, single-maintainer tool this repo has zero mileage with —
# it is NOT yet cited in any customer evidence pack and does not gate merges. Gate ramp: once a
# release cycle of findings has been triaged (real leaks fixed, false positives documented via
# `pgrls.toml` rule config), promote lint/verify to blocking and add this job to the required-check
# convention in scripts/release-readiness.ts.
#
# WHAT GETS MIGRATED (the part that matters for grading a linter against real RLS): this job applies
# the SAME production migration composition Railway itself runs — `bun apps/site/lib/deploy-migrate.ts`
# (ADR-0139), invoked today as services/license's `preDeployCommand` against the real Railway
# Postgres. That script assembles + applies the shared `@caisson/platform-migrations` chain
# (credits, entitlement_grant, license_grant, ai_meter, account_member, grant_consumption,
# renewal_extension, subscription_status, order_record, affiliate_code, …) plus the apps/site-local
# extras (`site-migrations.ts`: tenant_ai_credential, byok_key_meta, compliance_attestation, the two
# ask_ai_* tables) through the shared forward-only runner (`@caisson/migrate`) — every FORCE-RLS
# tenant table this product ships, byte-identical to what apps/site/lib/deploy-migrate.test.ts already
# proves against a PGlite double. Reusing this exact entry point (rather than hand-assembling a
# parallel migration set here) means pgrls always grades the real shipped schema, never a CI-only
# stand-in that can drift from it.
#
# NOT migrated here, deliberately:
#  - apps/admin's own migration (admin-deploy-migrate.ts) only ensures ITS OWN better-auth tables
#    (a separate ADMIN_AUTH_DATABASE_URL) — no RLS tables, out of scope for a tenant-isolation prover.
#  - packages/{alerting,audit-worm,compliance,field-crypto,retention-runner}/src/migrations and their
#    packages/cli/migrations-bundle/* copies are edition SCAFFOLDING shipped to GENERATED customer
#    apps via `create-caisson` — they are never applied to caisson.sh's own live Postgres, so pgrls
#    grading them here would be grading the wrong database.
#  - packages/tenancy-rls was the task's own candidate for "the RLS package" but on inspection it
#    carries no `migrations/` dir at all — it's a helper library (drizzle/prisma/supabase RLS-wiring
#    adapters + `buildTenantPolicySql`), not a migration source; `site-migrations.ts` is the caller
#    that turns its helper into an actual applied migration, which IS in scope above.
#
# `pgrls diff` is intentionally NOT run: it is a semantic diff between two schema SOURCES (two
# snapshots, or a snapshot vs a live DB) and this repo keeps no committed `pgrls snapshot` baseline
# to diff against — running it here would only ever compare "empty" to "today," which is just `lint`
# with extra steps. Revisit once a baseline snapshot is committed (see the `pgrls snapshot` docs).
on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC every Monday — an independent weekly drift check regardless of PR traffic.
    - cron: "0 6 * * 1"
  pull_request:
    # Defaults plus ready_for_review — flipping a draft to ready fires the full run (CAISSON-96).
    types: [opened, synchronize, reopened, ready_for_review]
    # Narrow to the trees that actually feed the composed chain above (not all of packages/**) —
    # see the header comment for what's excluded and why. Widen this list if a future migration
    # source lands somewhere else in the composed chain.
    paths:
      - ".github/workflows/pgrls-advisory.yml"
      - "packages/platform-migrations/**"
      - "packages/migrate/**"
      - "packages/kernel/src/migration-assembly.ts"
      - "packages/kernel/src/migration-assembly.test.ts"
      - "apps/site/lib/deploy-migrate.ts"
      - "apps/site/lib/deploy-migrate.test.ts"
      - "apps/site/lib/site-migrations.ts"
      - "apps/site/lib/site-migrations.test.ts"
      - "apps/site/lib/ask-ai/question-log.ts"
      - "apps/site/lib/ask-ai/spend.ts"

concurrency:
  group: "pgrls-advisory-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pgrls:
    # CAISSON-96 draft guard — drafts skip; the ready_for_review trigger runs the full scan.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    services:
      # An ephemeral Postgres the job owns start-to-finish — never a shared/long-lived instance.
      # 17-alpine matches the pin the rest of the fleet targets (Railway Postgres is also PG17).
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: apply the real platform migration chain (ADR-0139, same script Railway's preDeployCommand runs)
        run: bun apps/site/lib/deploy-migrate.ts
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28" # pinned (same pin as security-scan.yml/support-bot.yml; no drift)
      - name: install pgrls (pinned exact version — beta, single-maintainer tool; bump deliberately)
        run: |
          set -eo pipefail
          uv tool install pgrls==0.48.2
          export PATH="$HOME/.local/bin:$PATH"
          command -v pgrls >/dev/null || { echo "::error::pgrls missing after install"; exit 1; }
      - name: pgrls lint + verify (advisory — SARIF/JSON artifacts, never blocks the job)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          out="$RUNNER_TEMP/pgrls-out"
          mkdir -p "$out"
          # lint: the 64-rule heuristic pass over every RLS policy in the applied schema.
          pgrls lint --database-url "$DATABASE_URL" --format sarif > "$out/lint.sarif" || true
          pgrls lint --database-url "$DATABASE_URL" --format json > "$out/lint.json" || true
          cat "$out/lint.json" || true
          # verify: the Z3 tenant-isolation prover, one run per threat model the task calls for.
          # cross-tenant is the headline proof (a session in tenant A can never read/write tenant
          # B's row) so it additionally gets a SARIF export, mirroring lint's artifact shape.
          pgrls verify --database-url "$DATABASE_URL" --mode anon --format json > "$out/verify-anon.json" || true
          pgrls verify --database-url "$DATABASE_URL" --mode cross-tenant --format json > "$out/verify-cross-tenant.json" || true
          pgrls verify --database-url "$DATABASE_URL" --mode cross-tenant --format sarif > "$out/verify-cross-tenant.sarif" || true
          pgrls verify --database-url "$DATABASE_URL" --mode write --format json > "$out/verify-write.json" || true
          cat "$out/verify-cross-tenant.json" || true
      - name: upload pgrls artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pgrls-out-${{ github.sha }}
          path: ${{ runner.temp }}/pgrls-out
          if-no-files-found: warn
          retention-days: 30
