name: mirror-sync
# Append-syncs the open (Apache-2.0) base into the public mirror repo caisson-sh/caisson-oss.
# Runs scripts/export-public-mirror.ts (the exporter — package selection, @caisson-sh/* scope
# rename, self-containment gate), then clones the mirror, replaces its working tree with the
# fresh export, and pushes ONE new commit ("chore: mirror sync from <source sha>") on top.
#
# APPEND-ONLY MODEL (ADR-0318 F2/F3 — supersedes the original force-push snapshot model): the
# mirror's history was backfilled once at the 2026-07-10 cut-over (gate-passing exporter runs at
# real historical SHAs, committed at cut-over — NEVER backdated; the real milestone date lives in
# the commit message only) and every sync since APPENDS. Never force-push here again — a rewrite
# would break clones/stars and violate the append-only lock. Development, blame, and PRs still
# live in THIS (private) repo; the mirror remains a generated read-only artifact (see
# scripts/mirror-assets/CONTRIBUTING.md).
#
# STAYS INERT UNTIL ARMED: MIRROR_PUSH_TOKEN (a fine-grained PAT scoped to contents:write on
# caisson-sh/caisson-oss ONLY) gates every real step via the guard below — absent token, the job
# runs as a GREEN no-op (same posture as deploy-railway.yml).
# TRIGGER: the release train (ADR-0318 R1/R2 — release-train.yml dispatches this as leg 2) or a
# manual dispatch. The per-main-push trigger is RETIRED (Kickoff M, W4): under the append-only
# mirror model a sync per push would mint a mirror commit per merge; the mirror advances per
# RELEASE instead.
on:
  workflow_dispatch:
    inputs:
      ref:
        # ADR-0325: the release train passes the release tag so the mirror export is anchored to
        # the SAME SHA as the tarballs/ledger. Empty (a manual dispatch) = default branch tip.
        description: "Tag or SHA to export from (the release train passes the release tag)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  mirror-sync:
    # STAYS GitHub-hosted: holds a cross-repo push token (MIRROR_PUSH_TOKEN) → a write cred to
    # an external repo stays off the fleet, same posture as deploy-railway.yml's RAILWAY_TOKEN.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release # ADR-0327 rider 2 parity — this job reads MIRROR_PUSH_TOKEN (a release-propagation leg)
    steps:
      # Inert-until-armed guard (mirrors deploy-railway.yml): `secrets` can't be read in a job/step
      # `if:`, so map it to an env here and publish an `armed` output. Absent token → every step
      # below skips → the job succeeds as a no-op instead of failing (the mirror repo may not exist
      # yet). Does NOT arm the sync itself — it self-arms when the operator sets the secret.
      - name: arm check (MIRROR_PUSH_TOKEN present?)
        id: guard
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          if [ -n "${MIRROR_PUSH_TOKEN}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mirror-sync is inert — MIRROR_PUSH_TOKEN not set; skipping (mirror repo may not exist yet)"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: steps.guard.outputs.armed == 'true'
        with:
          # Empty ref = the checkout action's default (the dispatching branch tip).
          ref: ${{ github.event.inputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.armed == 'true'
        with:
          bun-version: "1.3.14"
      - name: install
        if: steps.guard.outputs.armed == 'true'
        run: bun install --frozen-lockfile
      - name: export public mirror
        if: steps.guard.outputs.armed == 'true'
        run: |
          bun scripts/export-public-mirror.ts \
            --out mirror-out \
            --generated-at "$(git log -1 --format=%cs)"
      - name: append sync commit to caisson-sh/caisson-oss (never force)
        if: steps.guard.outputs.armed == 'true'
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          set -e
          SOURCE_SHA="$(git rev-parse --short HEAD)"
          git clone --depth 1 --branch main -q \
            "https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com/caisson-sh/caisson-oss.git" mirror-clone
          # Replace the clone's working tree with the fresh export; .git stays, so the new
          # tree lands as ONE appended commit on the existing history (ADR-0318 append-only).
          find mirror-clone -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r mirror-out/. mirror-clone/
          cd mirror-clone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "mirror already current — nothing to sync"
          else
            git commit -q -m "chore: mirror sync from ${SOURCE_SHA}"
            git push origin HEAD:main
          fi
