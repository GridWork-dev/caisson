name: mirror-sync
# Snapshot-syncs the open (Apache-2.0) base into the public mirror repo caisson-sh/caisson-oss.
# Runs scripts/export-public-mirror.ts (the exporter — package selection, @caisson-sh/* scope
# rename, self-containment gate) then force-pushes the generated mirror-out/ tree as a SINGLE
# commit to the mirror's main branch.
#
# SNAPSHOT MODEL (deliberate): the mirror carries no commit history of its own — each sync
# replaces main with one fresh commit ("chore: mirror sync from <source sha>"). History,
# blame, and PRs live in THIS (private) repo; the mirror is a generated read-only artifact
# (see scripts/mirror-assets/CONTRIBUTING.md). A force-push is therefore correct, not sloppy —
# a real multi-commit history on the mirror would imply a development surface it isn't.
#
# STAYS INERT UNTIL ARMED: MIRROR_PUSH_TOKEN (a fine-grained PAT scoped to contents:write on
# caisson-sh/caisson-oss ONLY) is not yet a repo secret. The guard step reads it and skips every
# real step when absent, so the job runs as a GREEN no-op — the mirror repo may not exist yet.
# It self-enables once the operator adds the secret (same posture as deploy-railway.yml).
# TRIGGER: the release train (ADR-0318 R1/R2 — release-train.yml dispatches this as leg 2) or a
# manual dispatch. The per-main-push trigger is RETIRED (Kickoff M, W4): under the append-only
# mirror model a sync per push would mint a mirror commit per merge; the mirror advances per
# RELEASE instead.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  mirror-sync:
    # STAYS GitHub-hosted: holds a cross-repo push token (MIRROR_PUSH_TOKEN) → a write cred to
    # an external repo stays off the fleet, same posture as deploy-railway.yml's RAILWAY_TOKEN.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Inert-until-armed guard (mirrors deploy-railway.yml): `secrets` can't be read in a job/step
      # `if:`, so map it to an env here and publish an `armed` output. Absent token → every step
      # below skips → the job succeeds as a no-op instead of failing (the mirror repo may not exist
      # yet). Does NOT arm the sync itself — it self-arms when the operator sets the secret.
      - name: arm check (MIRROR_PUSH_TOKEN present?)
        id: guard
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          if [ -n "${MIRROR_PUSH_TOKEN}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mirror-sync is inert — MIRROR_PUSH_TOKEN not set; skipping (mirror repo may not exist yet)"
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.guard.outputs.armed == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.armed == 'true'
        with:
          bun-version: "1.3.14"
      - name: install
        if: steps.guard.outputs.armed == 'true'
        run: bun install --frozen-lockfile
      - name: export public mirror
        if: steps.guard.outputs.armed == 'true'
        run: |
          bun scripts/export-public-mirror.ts \
            --out mirror-out \
            --generated-at "$(git log -1 --format=%cs)"
      - name: push snapshot to caisson-sh/caisson-oss (force, single commit)
        if: steps.guard.outputs.armed == 'true'
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          set -e
          SOURCE_SHA="$(git rev-parse --short HEAD)"
          cd mirror-out
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: mirror sync from ${SOURCE_SHA}"
          git push --force "https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com/caisson-sh/caisson-oss.git" HEAD:main
