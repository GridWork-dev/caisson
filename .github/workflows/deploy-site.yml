name: deploy-site
# Direct-upload of the static-export marketing+docs site to Cloudflare Pages (ADR-0045).
# DEPLOY is operator-gated and separate from SHIP: this runs only on a merge to `main` or a manual
# dispatch — never on a pull request — so opening/merging a feature PR never triggers a deploy.
# Requires repo secrets CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit) + CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      # @caisson/ui is bundled into the site via transpilePackages — a token/UI change alters the
      # emitted output, so it must trigger a redeploy too.
      - "packages/ui/**"
      - "infra/terraform/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

# Least privilege: this job uses Cloudflare secrets, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to commit SHAs (supply-chain: this job holds a prod deploy token).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # Build must be green before the deploy step runs (sequential steps fail-stop the job).
      - name: build (Next static export → apps/site/out)
        run: bun run --filter @caisson/site build
      - name: deploy to Cloudflare Pages (direct upload)
        # Run from apps/site so wrangler resolves apps/site/wrangler.jsonc AND apps/site/functions/.
        # Cloudflare resolves the functions/ directory relative to the CWD (not the output dir), so
        # the waitlist Pages Function only deploys when the project dir is the working directory.
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler pages deploy out
          --project-name=caisson-site
          --branch=main
