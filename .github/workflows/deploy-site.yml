name: deploy-site
# Direct-upload of the static-export marketing+docs site to Cloudflare Pages (ADR-0045).
# DEPLOY is operator-gated and separate from SHIP: this runs only on a merge to `main` or a manual
# dispatch — never on a pull request — so opening/merging a feature PR never triggers a deploy.
# Requires repo secrets CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit) + CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "infra/terraform/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # Build must be green before the deploy step runs (sequential steps fail-stop the job).
      - name: build (Next static export → apps/site/out)
        run: bun run --filter @caisson/site build
      - name: deploy to Cloudflare Pages (direct upload)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler pages deploy apps/site/out
          --project-name=caisson-site
          --branch=main
