name: r2-parity-probe
# ADVISORY R2 tarball-integrity probe. registry/tarballs.json advertises, for every published
# (id,version), the R2 object key + its SHA-1 shasum + byte size that buyers' `bun install`
# integrity-checks against. This job GETs every advertised object from the caisson-registry-tarballs
# bucket, SHA-1s the bytes, and compares to the row — going RED in the Actions tab on any missing /
# hash-mismatched / unreachable object (an operator R2 overwrite, a partial upload, or a row recorded
# for an object that never landed).
#
# ADVISORY ONLY, same convention as pgrls-advisory.yml / toolchain-advisory.yml: a red run is
# GitHub-UI visibility, NOT a merge gate and NOT new alert plumbing (no Telegram/tg-bridge wiring —
# that is the established pattern for this private repo's advisory lanes). It adds NO new credential
# surface: it reads the SAME R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID release secrets
# publish.yml already holds for this one bucket (scoped read on the S3-compatible R2 endpoint).
#
# TRIGGERS: a daily cron for periodic drift, PLUS workflow_run after every successful publish so a
# freshly-uploaded catalog is verified immediately rather than up to a day later. workflow_dispatch
# for on-demand runs.
on:
  schedule:
    # 05:00 UTC daily — an independent daily integrity check regardless of release traffic.
    - cron: "0 5 * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["publish"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: r2-parity-probe
  cancel-in-progress: false

jobs:
  r2-parity-probe:
    # Only run the workflow_run leg after a SUCCESSFUL publish (a failed/cancelled publish left R2
    # untouched or half-written; the daily cron still covers that case on its own cadence). Non-
    # workflow_run events (schedule, dispatch) always run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Blacksmith per ADR-0365 (fleet-only sweep; R2 read creds accepted, same posture as publish.yml). `aws` CLI is
    # preinstalled on ubuntu-latest.
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: probe R2 objects against tarballs.json
        env:
          # The aws CLI reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the environment; the
          # probe builds the R2 endpoint from R2_ACCOUNT_ID. Same three release secrets publish.yml
          # uses for this bucket — no new credential.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: bun registry/scripts/r2-parity-probe.ts
