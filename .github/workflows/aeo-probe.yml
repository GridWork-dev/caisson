name: aeo-probe

# The AI-citation probe loop (ADR-0254, gap #9). Runs tooling/scripts/aeo-probe.ts against 18
# canonical questions x 3 OpenRouter-routed engines (~$1.20/run in tokens), then commits the
# resulting dated snapshot section in docs/gtm/aeo-citation-tracking.md back to main.
# Blacksmith VM-per-job (ADR-0326) — this job's write scope is one docs file via the built-in
# ephemeral GITHUB_TOKEN, not a cross-repo/prod credential (contrast publish.yml/mirror-sync.yml,
# which stay hosted because they hold R2/cross-repo-PAT creds).
#
# OPERATING MODE (as of 2026-07-19): local operator-key runs are the normal cadence — the
# operator runs the probe by hand with their own OPENROUTER_API_KEY, so the monthly `schedule`
# trigger was removed. This workflow_dispatch path stays as a dispatch-armed fallback: it will
# run in CI (and commit the snapshot) if OPENROUTER_API_KEY is ever set as a repo secret; until
# then the guard step below keeps it a GREEN no-op rather than a red failure.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to 'true' to probe only question #1 (smoke test, no snapshot growth)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: aeo-probe
  cancel-in-progress: false

jobs:
  aeo-probe:
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: arm check (OPENROUTER_API_KEY present?)
        id: guard
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${OPENROUTER_API_KEY}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::aeo-probe is inert — OPENROUTER_API_KEY not set; skipping (green no-op)"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.guard.outputs.armed == 'true'
        with:
          # Built-in GITHUB_TOKEN for the commit-back (no stored PAT — same posture as
          # publish.yml's registry-ledger commit).
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.armed == 'true'
        with:
          bun-version: "1.4.2"
      - name: run the probe loop
        if: steps.guard.outputs.armed == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          POSTHOG_CAPTURE_KEY: ${{ secrets.POSTHOG_CAPTURE_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          # Via env, never interpolated into the script body — a `${{ }}` inside `run:` is a
          # shell-injection surface for anyone with workflow_dispatch rights.
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="--dry-run"
          fi
          bun tooling/scripts/aeo-probe.ts $ARGS
      - name: commit the snapshot
        if: steps.guard.outputs.armed == 'true'
        run: |
          set -e
          if git diff --quiet -- docs/gtm/aeo-citation-tracking.md; then
            echo "::notice::no snapshot change (idempotent same-day rerun, or dry-run) — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gtm/aeo-citation-tracking.md
          git commit -m "docs(gtm): aeo-probe snapshot $(date -u +%Y-%m-%d)"
          git push
