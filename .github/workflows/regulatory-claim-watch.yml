name: regulatory-claim-watch
# Weekly ADVISORY watch for the dated EU AI Act claims on the framework pages and in
# WRITING_PIECES. The script discovers those checked-in targets, fetches only their declared
# public primary sources, and reports unreachable sources or declared watch text that disappeared.
# It cannot interpret a changed regulation, determine legal correctness, bypass an upstream
# interstitial, or inspect a locator inside a PDF; reachability-only cases stay explicit in the
# report. Report-only: the script always exits 0, this workflow is NOT a required check, and no
# source outage can block a merge. No credential is used — every outbound request is an
# unauthenticated public read.
on:
  workflow_dispatch: {}
  schedule:
    # Sunday 05:23 UTC — offset from nist-catalog-watch (05:11) and the daily R2 probe (05:00).
    - cron: "23 5 * * 0"

permissions:
  contents: read

concurrency:
  group: regulatory-claim-watch
  cancel-in-progress: true

jobs:
  public-source-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        id: checkout
        if: always()
        continue-on-error: true
      - name: initialize advisory report
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            '## Regulatory claim watch — report-only' \
            '' \
            'Bootstrap has not completed. No PASS is implied.' \
            > regulatory-claim-watch-report.md
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup_bun
        if: always()
        continue-on-error: true
        with:
          bun-version: "1.3.14"
      - name: bootstrap + check declared public sources (report-only, always exits 0)
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_BUN_OUTCOME: ${{ steps.setup_bun.outcome }}
        run: |
          if [[ "$CHECKOUT_OUTCOME" != "success" || "$SETUP_BUN_OUTCOME" != "success" ]]; then
            printf '%s\n' \
              '## Regulatory claim watch — report-only' \
              '' \
              "Bootstrap failed (checkout: $CHECKOUT_OUTCOME; Bun setup: $SETUP_BUN_OUTCOME). No PASS is implied." \
              > regulatory-claim-watch-report.md
            sed -n '1,200p' regulatory-claim-watch-report.md
            exit 0
          fi
          apps/site/scripts/run-regulatory-claim-watch.sh \
            regulatory-claim-watch-report.md \
            timeout --kill-after=15s 8m \
            bash -c 'bun install --frozen-lockfile && exec bun apps/site/scripts/regulatory-claim-watch.ts'
      - name: upload the report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regulatory-claim-watch-report
          path: regulatory-claim-watch-report.md
          if-no-files-found: warn
