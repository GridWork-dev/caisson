name: regulatory-claim-watch
# Weekly ADVISORY watch for the dated EU AI Act claims on the framework pages and in
# WRITING_PIECES. The script discovers those checked-in targets, fetches only their declared
# public primary sources, and reports unreachable sources or literal locators that disappeared.
# It cannot interpret a changed regulation, determine legal correctness, or reliably inspect a
# locator inside a PDF; those cases are reported for human review. Report-only: the script always
# exits 0, this workflow is NOT a required check, and no source outage can block a merge. No
# credential is used — every outbound request is an unauthenticated public read.
on:
  workflow_dispatch: {}
  schedule:
    # Sunday 05:23 UTC — offset from nist-catalog-watch (05:11) and the daily R2 probe (05:00).
    - cron: "23 5 * * 0"

permissions:
  contents: read

concurrency:
  group: regulatory-claim-watch
  cancel-in-progress: true

jobs:
  public-source-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: install workspace deps
        run: bun install --frozen-lockfile
      - name: discover + check declared public sources (report-only, always exits 0)
        run: |
          bun apps/site/scripts/regulatory-claim-watch.ts | tee regulatory-claim-watch-report.md
      - name: upload the report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regulatory-claim-watch-report
          path: regulatory-claim-watch-report.md
          if-no-files-found: warn
