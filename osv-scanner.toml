reason = "brace-expansion DoS via unbounded expansion (OOM). Remaining copies after the 2026-07-25 bump wave are 1.1.16 (minimatch@3 chains under eslint tooling) and 2.1.2 (minimatch@5-9 chains) — NO patched 1.x/2.x release exists (fix only in 5.0.8, which the 5.x copy already runs). Forcing 5.x into minimatch@<10 parents is a cross-major breakage risk for a dev/build-time-only surface whose expansion inputs are first-party glob patterns, never attacker-controlled. Revisit when upstream publishes patched 1.x/2.x or parents bump minimatch. Accepted 2026-07-25 (resident, clean-state sweep — flagged for operator retro-veto)."
