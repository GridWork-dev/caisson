[[IgnoredVulns]]
id = "CVE-2023-54404"
ignoreUntil = 2027-02-10
reason = "zod 3.25.76, held by inngest's own ^3.25.0 dependency (still current in inngest 4.26). zod/v3 is affected: ZodArray reports one issue per failing element with no cap, and no fixed 3.x release exists. In this repo inngest uses it only to parse Inngest Event API responses and signed Inngest requests, and caisson mounts no inngest serve handler. inngest moving to zod 4, or a root override, would only hide this, because zod 4.6.6 still ships the unfixed ./v3 export; re-check those inngest code paths at expiry. This ignore matches the advisory ID across the whole tree, so it would also hide any other zod below 4.6.6 that enters the lockfile. Accepted 2026-11-10."
