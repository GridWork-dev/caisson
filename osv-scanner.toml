reason = "@opentelemetry/core 2.0.1, transitive under @trigger.dev/core's pinned OTel instrumentation (the main OTel suite is already on the fixed 2.8.0). Header-propagator over-allocation, practically bounded by Node's 16KB max-http-header-size; forcing the trigger.dev-nested core to 2.8.0 risks breaking trigger.dev runtime telemetry. Accepted 2026-07-10."
