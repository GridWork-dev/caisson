[project]
name = "caisson-assert-lane"
version = "0.1.0"
description = "Live, operator-run pre-release behavioral probe for support-bot + docs-RAG via Microsoft responsibleai/ASSERT. NOT the CI eval gate — see README.md."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-Caisson-Commercial" }
dependencies = [
    # Pinned exactly (ADR-0327/security-scan discipline): a hand-run tool with no CI gate to catch
    # an upstream regression should never float on a bare "assert-ai" spec.
    "assert-ai==0.1.0",
    # Only for the docs-RAG target's single POST call — support-bot's own httpx pin
    # (services/support-bot/pyproject.toml) covers the imported RagPipeline path.
    "httpx>=0.27,<0.29",
]

[tool.uv]
# This directory is a script + config bundle, not a distributable package (task scope: files under
# tools/assert-lane/ only) — skip building/installing it as an editable project.
package = false
