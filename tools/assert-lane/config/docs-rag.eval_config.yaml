# LIVE, operator-run, pre-release behavioral probe for services/docs POST /query (ADR-0096).
# NOT the CI gate — that's services/docs/src/retrieval-golden.integration.test.ts (hermetic,
# FakeEmbedder) + services/docs/live/retrieval-golden-hybrid.live.test.ts (deterministic asserts
# on the deployed hybrid index). This file drives an LLM JUDGE over the same live endpoint instead
# — see tools/assert-lane/README.md for the distinction, cost note, and run command.
suite: docs-rag-behavior-v1
run: pre-release-1

behavior:
  name: docs_rag_grounding
  description: |-
    # Docs-RAG Retrieval Grounding

    services/docs POST /query is the sole retrieval surface the support-bot and buyer agents
    ground answers on (ADR-0009: "never answers from anything but the codebase/docs RAG",
    services/docs/README.md). This behavior evaluates the retrieval layer directly — no
    generation sits on top of it here — before the support-bot behavior below layers a model on
    the same corpus.

    ## Quality failures
    - returning chunks that do not actually address the query (irrelevant retrieval)
    - returning a hit with no real, citable `source` path
    - `NO_RESULTS` for a question the committed docs/README corpus does in fact cover

    ## Consistency failures
    - retrieved pricing/licensing chunks (`kind: pricing`, services/docs/src/types.ts) that
      contradict each other or read stale against the committed pricebook

context: |-
  The target is services/docs POST /query — a hybrid FTS5 + sqlite-vec retrieval endpoint (bm25 +
  RRF fuse, no generation) fronting the Caisson docs/README corpus (apps/site/content/docs/**.mdx
  + packages/*/README.md). The callable renders the top-k hits as a numbered `[source] text`
  pseudo-answer so the judge scores grounding/citation quality of retrieval alone.

pipeline:
  # gw-core Q5 fork (which model/lane powers case generation across the repo's eval surfaces) is
  # scoped OUT of this trial — see README.md "Scope note". systematize/test_set below pin one
  # fixed model directly; no engine-lane indirection here.
  systematize:
    behavior_category_count: 4
    model:
      name: openrouter/anthropic/claude-sonnet-4.6
      temperature: 1.0
  test_set:
    prompt:
      sample_size: 8
    scenario:
      sample_size: 2
    model:
      name: openrouter/anthropic/claude-sonnet-4.6
      temperature: 1.0
  inference:
    concurrency: 1 # this is a hand-run pre-release probe, not a throughput benchmark
    target:
      callable: wrappers:chat_docs_rag
  judge:
    model:
      name: openrouter/anthropic/claude-sonnet-4.6
      temperature: 0.0
      max_tokens: 4000
    dimensions:
      grounding_violation:
        description: Did the retrieved context fail to ground an on-topic, citable pseudo-answer?
        rubric: |-
          true = the returned chunks are off-topic for the question, missing a real [source]
          citation, or the response is NO_RESULTS for something the docs/README corpus covers
          false = the returned chunks are on-topic and every chunk carries a real [source] citation
      pricing_inconsistency:
        description: Do any retrieved pricing/licensing chunks contradict each other?
        rubric: |-
          true = a retrieved chunk states a price, term, or license that contradicts another
          retrieved chunk in the same response
          false = pricing/licensing chunks in the retrieved set are internally consistent
