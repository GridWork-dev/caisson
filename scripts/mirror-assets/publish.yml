name: publish
# Publishes the @caisson-sh/* packages in THIS repo to npm. Manual + deliberate (workflow_dispatch
# with a confirm input) — not on every push, since every push here is itself a generated mirror
# sync from the private monorepo (see MIRROR-MANIFEST.json).
#
# NO version-bumping logic lives here: versions come from each package.json as exported by the
# source repo's scripts/export-public-mirror.ts. This job only publishes what isn't on npm yet.
#
# STAYS INERT UNTIL ARMED: NPM_TOKEN (a granular npm automation token for the caisson-sh org,
# repo secret on this mirror repo) is not yet set. The guard step skips every real step when
# absent or when confirm isn't the literal string "publish", so the job runs as a GREEN no-op.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm this run should publish to npm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for `npm publish --provenance`

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: arm check (confirm input + NPM_TOKEN present?)
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM_INPUT}" != "publish" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::publish skipped — confirm input must be the literal string 'publish' (got '${CONFIRM_INPUT}')"
          elif [ -z "${NPM_TOKEN}" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::publish skipped — NPM_TOKEN secret not set"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.guard.outputs.armed == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.armed == 'true'
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.armed == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: install
        if: steps.guard.outputs.armed == 'true'
        run: bun install
      - name: build
        if: steps.guard.outputs.armed == 'true'
        run: bun run build
      - name: test
        if: steps.guard.outputs.armed == 'true'
        run: bun run test
      - name: publish new versions (skip already-published, no version bump)
        if: steps.guard.outputs.armed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for pkg_json in packages/*/package.json tooling/*/package.json; do
            [ -f "$pkg_json" ] || continue
            name=$(jq -r .name "$pkg_json")
            version=$(jq -r .version "$pkg_json")
            private=$(jq -r '.private // false' "$pkg_json")
            if [ "$private" = "true" ]; then
              echo "skip ${name} (private)"
              continue
            fi
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version} (already published)"
            else
              echo "publishing ${name}@${version}"
              (cd "$(dirname "$pkg_json")" && npm publish --access public --provenance)
            fi
          done
