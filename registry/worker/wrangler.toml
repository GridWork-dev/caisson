# Registry read Worker — LIVE deploy config (ADR-0047 seam → live). handler.ts stays the
# unit-tested router + the env.REGISTRY_INDEX seam (503 when unset); this config deploys
# deploy-entry.ts instead, which esbuild-inlines the CI-built registry/index.json straight into the
# bundle — no env var, no KV/R2 binding, no 503 path, no binding-size limit on the ~8KB index.
# Deploy via registry/worker/deploy.sh (`bunx wrangler deploy`). DEPLOY is operator-gated + separate
# from SHIP (mirrors .github/workflows/deploy-site.yml): token via env CLOUDFLARE_API_TOKEN, account
# via env CLOUDFLARE_ACCOUNT_ID. Serves the PUBLIC registry index (allowlist source of truth, no
# secrets) at caisson-registry.<account-subdomain>.workers.dev.
name = "caisson-registry"
main = "deploy-entry.ts"
compatibility_date = "2026-06-27"
# ../schema/registry-index.ts statically imports `node:fs` (readFileSync, for the file-read path
# loadRegistryIndexFromFile) — esbuild bundles the whole module even though deploy-entry only calls
# loadRegistryIndex over the inlined JSON. The import is evaluated at isolate startup, so without
# this flag workerd fails to instantiate the Worker. readFileSync is never CALLED at runtime (the
# index is inlined, not read from disk); the flag only makes the `node:fs` import resolve.
compatibility_flags = ["nodejs_compat"]

# Publish to the account's workers.dev subdomain. Kept as the fallback origin alongside the
# custom domain below.
workers_dev = true

# Custom domain (ADR-0223 Fork 2.1): registry.caisson.sh fronts the Worker so a buyer's generated
# .npmrc points at a stable host (`@caisson:registry=https://registry.caisson.sh`). LIVE — the DNS
# record and zone binding are provisioned and the host answers; this entry is what tells wrangler to
# keep the custom domain attached on each deploy.
routes = [
  { pattern = "registry.caisson.sh", custom_domain = true }
]

# R2 tarball store (ADR-0223 H1/G1, Fork 2.1): tarball bytes served same-origin (A1) via env.TARBALLS.
# LIVE — the bucket `caisson-registry-tarballs` exists (created 2026-07-03), the binding is attached
# to the deployed Worker, and CI populates it.
[[r2_buckets]]
binding = "TARBALLS"
bucket_name = "caisson-registry-tarballs"

# Edge license-revocation deny-set (ADR-0225 R-4=B, launch-runbook §8): deploy-entry reads
# `revocations/deny-set.json` via env.REVOCATIONS on a 60s stale-while-revalidate TTL, STRICT
# fail-open (absent object = nobody denied, installs never break). The admin-side publisher stays
# env-gated ("skipped") until CAISSON_REVOCATIONS_PUT_URL is provisioned on caisson-admin.
[[r2_buckets]]
binding = "REVOCATIONS"
bucket_name = "caisson-registry-revocations"

# App-level per-IP rate limiting (CAISSON-55): the NATIVE Cloudflare Workers Rate Limiting binding
# (`simple` algorithm — the only supported type; `period` must be 10 or 60). Three INDEPENDENT
# namespaces so a burst against one route class (e.g. tarball bytes) never exhausts another's budget
# (catalog reads and npm packument reads stay unaffected) — two bindings sharing a namespace_id share
# counters account-wide, which is deliberately NOT what we want here. `namespace_id` only needs to be a
# unique-per-account integer string; these are arbitrary (CAISSON-55xx) and may be changed at DEPLOY if
# they ever collide with another Worker's binding on this account. Budgets are operator-tunable by
# editing `limit`/`period` here and redeploying — rate-limit.ts (registry/worker/rate-limit.ts) reads
# them from these bindings at runtime, it does not hardcode numbers. Fail-open on a missing/erroring
# binding (see rate-limit.ts). LIVE — all three namespaces are attached to the deployed Worker.
[[ratelimits]]
name = "RATE_LIMIT_CATALOG"
namespace_id = "5501"

  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "RATE_LIMIT_NPM_PACKUMENT"
namespace_id = "5502"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "RATE_LIMIT_TARBALL"
namespace_id = "5503"

  [ratelimits.simple]
  limit = 60
  period = 60

# Cloudflare Workers observability (native Workers Logs) — invocation logs + sampling in the CF
# dashboard, no external collector. Distinct from the app-side OTel stack (ADR-0117; fleet sink is
# Grafana Cloud since ADR-0177). Enabled so the license-gating redeploy (ADR-0136) is observable at
# the edge.
[observability]
enabled = true
head_sampling_rate = 1

# OTLP bridge (ADR-0142, repointed by ADR-0177/0207): CF-native OpenTelemetry export — the
# sanctioned way to get the edge Worker's spans/logs into the same Grafana Cloud stack as the Node
# services, instead of a hand-rolled tail worker. Cloudflare's OTel export is in open beta; the
# wrangler syntax below is the documented form
# (developers.cloudflare.com/workers/observability/exporting-opentelemetry-data).
#
# DEPLOYED BUT NOT YET EXPORTING. These blocks ARE live on the Worker (they read back off the
# deployed script settings), so this is no longer "inert until deploy" — but nothing is reaching
# Grafana Cloud, because the two names below resolve to nothing:
#   `GET /accounts/<id>/workers/observability/destinations` returns `result: []` (measured
#   2026-08-15). `destinations` names must match typed destinations REGISTERED IN THE CF DASHBOARD
#   (Workers Observability → Add destination → one Traces + one Logs, each pointing at the Grafana
#   Cloud OTLP endpoint with its auth header). Registering them is the one remaining operator act.
# The blocks are harmless in this state — an unresolvable destination drops the export, it does not
# fail the Worker — and `persist` is left at its default (true), so the CF-dashboard observability
# leg above keeps working regardless and Grafana Cloud simply gets no copy yet.
[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["grafana-otlp-traces"]

[observability.logs]
enabled = true
head_sampling_rate = 1
destinations = ["grafana-otlp-logs"]
