# Railway service config — apps/site (@caisson/site). ADR-0114/0115/0116/0117/0118.
#
# Dashboard settings for THIS service (the build context must be the repo root, see Dockerfile header):
#   Root Directory       = /                     (repo root — the Docker build context)
#   Config-as-code path  = apps/site/railway.toml (this file)
#
# Service env vars (set in the Railway service — NEVER committed). NAMES ONLY: a value never belongs
# in a tracked file, and the names ARE the documentation.
#
# Regenerated 2026-08-15 from the live service's own variable list (CLOUD-AUDIT §7.1, which measured
# this block as documenting a fraction of what is set: 13 variables set and unnamed here, 8 named
# here and unset). Nothing in CI parses this block — apps/admin's topology map checks only that the
# file EXISTS — so it drifts silently and only a hand comparison catches it. The source of truth for
# a re-check is `railway variables --service caisson-site`, or the API's `unrendered: true` view,
# which is what excludes Railway's own injected RAILWAY_* set from the count below.
#
# --- SET on the live service (28) ------------------------------------------------------------------
#   DATABASE_URL                       (required — real tenant reads; PGlite double when unset, dev only)
#   BETTER_AUTH_SECRET                 (required — better-auth session signing; /dashboard sign-in 503s without it)
#   BETTER_AUTH_URL                    (required — the canonical origin, e.g. https://caisson.sh; callback base)
#   SESSION_TOKEN_HMAC_KEY             (required once DATABASE_URL + BETTER_AUTH_SECRET are set — ADR-0366
#                                       hashes session tokens at rest; auth-server.ts THROWS rather than
#                                       store raw tokens, so a missing value is a crashed boot, not a
#                                       degraded sign-in)
#   NEXT_PUBLIC_PADDLE_CLIENT_TOKEN    (required — Paddle.js client token, ADR-0116; build ARG, see Dockerfile)
#   NEXT_PUBLIC_PADDLE_ENV             (required — "sandbox" | "production"; defaults to sandbox; build ARG)
#   PADDLE_API_KEY                     (required — server-only, ADR-0293 G14 self-serve cancel, POST
#                                       /subscriptions/{id}/cancel; unset ⇒ the cancel route 502s. Never a
#                                       client-side credential)
#   PADDLE_ENV                         (required — server-side "sandbox" | "production" selector for the
#                                       ADR-0293 cancel call's API base; mirrors NEXT_PUBLIC_PADDLE_ENV but
#                                       read server-side only, the same pair services/license sets)
#   TURNSTILE_SECRET                   (required — server verify of the bot challenge; fail-closed when set, D9)
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY     (required — renders the Turnstile widget; no widget when unset, D9)
#   DEMOS_ORIGIN_URL                   (required — ADR-0400, the caisson-demos origin this app rewrites
#                                       /demos/* to, e.g. http://caisson-demos.railway.internal:3040. MUST be
#                                       a build ARG, see Dockerfile: Next bakes rewrites into
#                                       routes-manifest.json at build, so a runtime-only value arms nothing.
#                                       UNSET is the fail-safe state — no rewrite, no /demos route, module
#                                       pages show the demo fallback text. A malformed value fails the build
#                                       rather than degrading quietly)
#   NEXT_PUBLIC_DISCORD_INVITE_URL     (optional — footer Discord link, G12; build ARG, see Dockerfile:
#                                       static pages bake the footer at build, so a runtime-only var leaves
#                                       every prerendered footer without the link)
#   NEXT_PUBLIC_PLAUSIBLE_DOMAIN       (optional — e.g. "caisson.sh", ADR-0118; build ARG; analytics no-ops)
#   NEXT_PUBLIC_POSTHOG_KEY            (optional — client PostHog project key, build-inlined; gates posthog-js
#                                       init + the web-vitals beacon. Semantically public by design, not a
#                                       secret — see lib/ask-ai/ai-capture.ts, which contrasts it with the
#                                       server key below)
#   POSTHOG_CAPTURE_KEY                (optional — SERVER-side PostHog ingestion key for $ai_generation events,
#                                       ADR-0356/CAISSON-120; write-only, fire-and-forget, never throws)
#   OTEL_EXPORTER_OTLP_ENDPOINT        (optional — the fleet OTLP sink, Grafana Cloud, ADR-0117/0177;
#                                       observability no-ops without it)
#   OTEL_EXPORTER_OTLP_HEADERS         (optional — Basic auth for that OTLP gateway, ADR-0177. Read by the
#                                       OTel SDK's own env convention, not by repo code: initObservability()
#                                       never passes opts.headers, so the exporter reads this itself)
#   OPENROUTER_API_KEY                 (required for Ask-AI — server-only; funds the /api/ask generation call.
#                                       Empty or invalid throws GenerationError)
#   DOCS_QUERY_URL                     (required for Ask-AI — the services/docs /query endpoint retrieval
#                                       calls. NOTE: the read site defaults to "" rather than failing, so an
#                                       unset value degrades silently)
#   DOCS_SERVICE_TOKEN                 (required for Ask-AI — Bearer to services/docs, whose own side is
#                                       fail-closed)
#   SUPPORT_BOT_URL                    (optional — base URL of services/support-bot. TWO independent callers:
#                                       the Ask-AI escalation flow and the post-purchase Discord role grant.
#                                       Both silently no-op when unset)
#   SUPPORT_BOT_GRANT_TOKEN            (optional — Bearer for that role-grant push; must match support-bot's
#                                       BILLING_GRANT_TOKEN and license's copy, a 3-way shared secret)
#   CAISSON_PROOF_PROXY_URL            (required for tenant evidence — the proof-proxy URL apps/site calls)
#   CAISSON_PROOF_PROXY_INTERNAL_HOST  (required for tenant evidence — internal hostname the client dials and
#                                       validates against; apps/admin is the proxy target)
#   CAISSON_PROOF_PROXY_SECRET         (required for tenant evidence — shared Bearer authenticating site→proxy)
#   RESEND_API_KEY                     (optional — transactional + product-updates mail)
#   RESEND_FROM                        (optional — From: for better-auth magic-link mail; defaults to
#                                       "Caisson <no-reply@caisson.sh>")
#   RAILWAY_DOCKERFILE_PATH            (redundant here — the [build] table below already sets
#                                       dockerfilePath, and config-as-code supersedes the dashboard var for
#                                       that field. Kept only because it is set on the live service; safe to
#                                       remove there)
#
# --- NAMED AS REQUIRED BUT NOT SET (8) -------------------------------------------------------------
#   AZURE_KEY_VAULT_URL                (HTTPS Azure vault URL)
#   AZURE_KEY_VAULT_KEY_NAME           (prefix for deterministic per-tenant KEKs)
#   AZURE_KEY_VAULT_WRAP_ALGORITHM     (exactly "RSA-OAEP-256")
#   AZURE_KEY_VAULT_PURGE_PROTECTION   (exactly "enabled"; the runtime also validates key recovery level)
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#                                      (explicit service-principal authentication)
#
#   These seven are the `site.byok-field-crypto` seam (tooling/scripts/railway-env-sync.ts). They are
#   REQUIRED and deliberately UNARMED: no Azure Key Vault, key, or service principal has ever been
#   provisioned (docs/deploy/STATE.md "Not armed, deliberately"; docs/ops/launch-runbook.md records
#   "No arming record exists yet"). Confirmed against the live service 2026-08-15 — zero of the seven
#   are set. It is a REQUIRED seam blocking paid launch, not an optional one.
#
#   The consequence is exact and worth stating where someone editing this file will see it: production
#   has no fallback (ADR-0387 chose Azure KMS over the derived pair, and byok.ts THROWS rather than
#   degrade). So POST /api/byok reaches lib/field-crypto-kms.ts, the purge-protection check throws
#   first, nothing catches it, and the buyer gets a 500 — AFTER their plaintext key has already been
#   sent to the upstream provider for validation. Blast radius is currently zero only because the
#   route is gated on an ai-production/everything entitlement no account holds. Arming this is an
#   operator act (credentials class); it is not a documentation defect, and these lines stay.
#
#   RESEND_SEGMENT_ID                  (the product-updates capture segment — DIFFERENT class: the route
#                                       fail-SOFTs to 202 "queued: false" when it or RESEND_API_KEY is
#                                       missing, per ADR-0085. Today every footer signup succeeds in the UI
#                                       and captures nothing. Intended, but worth knowing)
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/site/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
numReplicas = 1
