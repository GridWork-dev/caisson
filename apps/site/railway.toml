# Railway service config — apps/site (@caisson/site). ADR-0114/0115/0116/0117/0118.
#
# Dashboard settings for THIS service (the build context must be the repo root, see Dockerfile header):
#   Root Directory       = /                     (repo root — the Docker build context)
#   Config-as-code path  = apps/site/railway.toml (this file)
#
# Service env vars (set in the Railway service — NEVER committed):
#   DATABASE_URL                       (required for real tenant reads; PGlite double when unset — dev only)
#   AZURE_KEY_VAULT_URL                 (required for production BYOK — HTTPS Azure vault URL)
#   AZURE_KEY_VAULT_KEY_NAME            (required — prefix for deterministic per-tenant KEKs)
#   AZURE_KEY_VAULT_WRAP_ALGORITHM       (required — exactly "RSA-OAEP-256")
#   AZURE_KEY_VAULT_PURGE_PROTECTION     (required — exactly "enabled"; runtime also validates key recovery level)
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#                                        (required — explicit service-principal authentication; BYOK submit
#                                        THROWS when KMS is unavailable or invalid, never uses a derived/demo fallback)
#   BETTER_AUTH_SECRET                  (required — better-auth session signing; /dashboard sign-in 503s without it)
#   SESSION_TOKEN_HMAC_KEY              (required once DATABASE_URL + BETTER_AUTH_SECRET are set — ADR-0366 hashes
#                                        session tokens at rest; auth-server.ts THROWS rather than store raw tokens,
#                                        so a missing value is a crashed boot, not a degraded sign-in)
#   BETTER_AUTH_URL                     (the canonical origin, e.g. https://caisson.sh — better-auth callback base)
#   NEXT_PUBLIC_PADDLE_CLIENT_TOKEN     (Paddle.js client token — ADR-0116; MUST be a build ARG, see Dockerfile)
#   NEXT_PUBLIC_PADDLE_ENV              ("sandbox" | "production"; defaults to sandbox; build ARG)
#   PADDLE_API_KEY                       (server-only — ADR-0293 G14 self-serve cancel, POST /subscriptions/
#                                        {id}/cancel; unset ⇒ the cancel route 502s, never a client-side credential)
#   PADDLE_ENV                           ("sandbox" | "production", server-side selector for the ADR-0293 cancel
#                                        call's API base URL; defaults to sandbox — mirrors NEXT_PUBLIC_PADDLE_ENV
#                                        but read server-side only, same pair services/license already sets)
#   NEXT_PUBLIC_PLAUSIBLE_DOMAIN        (e.g. "caisson.sh" — ADR-0118; build ARG; analytics no-op without it)
#   OTEL_EXPORTER_OTLP_ENDPOINT         (the fleet OTLP sink, Grafana Cloud — ADR-0117/0177; observability no-ops without it)
#   RESEND_API_KEY / RESEND_SEGMENT_ID  (the product-updates capture form — inert (202) without them)
#   TURNSTILE_SECRET                    (server verify of the bot-challenge; fail-closed when set, D9)
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY      (renders the Turnstile widget client-side; no widget when unset, D9)
#   NEXT_PUBLIC_DISCORD_INVITE_URL      (footer Discord link, G12; MUST be a build ARG, see Dockerfile —
#                                        static pages bake the footer at build, so a runtime-only var
#                                        leaves every prerendered footer without the link)
#   DEMOS_ORIGIN_URL                    (ADR-0400 — the caisson-demos service origin this app rewrites
#                                        /demos/* to, e.g. http://caisson-demos.railway.internal:3040.
#                                        MUST be a build ARG, see Dockerfile: Next bakes rewrites into
#                                        routes-manifest.json at build, so a runtime-only value arms
#                                        nothing. UNSET is the fail-safe state — no rewrite, no /demos
#                                        route, module pages show the demo fallback text. Set it ONLY
#                                        after the caisson-demos service answers /demos/healthz; a
#                                        malformed value fails the build rather than degrading quietly.)
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/site/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
numReplicas = 1
