# SigNoz OpenTelemetry Collector — reference config (ADR-0142, Caisson Stage-2 Stream A)
#
# This is the BOOTSTRAP config the ingester (signoz-otel-collector) starts from. It is a
# deliberately minimal, honest reference: OTLP in → ClickHouse out for traces/logs/metrics.
#
# SAMPLING: 100% head sampling per ADR-0142 — there is NO sampler here and NO tail_sampling
# processor. Head sampling (the decision to emit a span at all) lives at the SDK, which
# defaults to 100% (parentbased_always_on). Do NOT add a probabilistic/tail sampler here
# unless the volume/cost math in ADR-0142 changes.
#
# The production Railway deployment additionally runs the collector under OpAMP
# (--manager-config), so the query-service pushes a richer effective pipeline on top of this
# base (signozspanmetrics for RED metrics, the usage 'meter', prometheus scrape, metadata
# exporter). That richness is server-managed; this file only needs to bring the collector up
# and route the three core signals. See infra/signoz/README.md.

receivers:
  otlp:
    protocols:
      grpc:
        # bind :: → IPv4+IPv6 dual-stack (Railway private networking is IPv6). 0.0.0.0
        # would only accept IPv4 and silently drop same-project IPv6 senders.
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # batch is the ONLY processor — no sampling. Values match the SigNoz stock defaults.
  batch:
    send_batch_size: 10000
    send_batch_max_size: 11000
    timeout: 10s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

exporters:
  clickhousetraces:
    datasource: tcp://clickhouse:9000/signoz_traces
    use_new_schema: true
    low_cardinal_exception_grouping: false
  clickhousemetricswrite:
    endpoint: tcp://clickhouse:9000/signoz_metrics
    resource_to_telemetry_conversion:
      enabled: true
  clickhouselogsexporter:
    dsn: tcp://clickhouse:9000/signoz_logs
    timeout: 10s
    use_new_schema: true

service:
  telemetry:
    logs:
      encoding: json
  extensions:
    - health_check
    - pprof
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhousetraces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhousemetricswrite]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouselogsexporter]
