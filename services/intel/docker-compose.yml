# services/intel — local compose for the standing intelligence daemon (ADR-0286).
#
# THIS DOES NOT DEPLOY ITSELF. Bringing it up on <host> is the operator-gated DEPLOY act:
# apply migrations/0001_intel_schema.sql against INTEL_DATABASE_URL as the least-privilege intel
# role, `docker compose up -d` from this directory (build context = repo root — see the Dockerfile
# header), and land the sanctioned-loopback-bind + egress-sink rows this file implies in
# gridwork-core identity/security-surfaces.md in the same change. See README.md for the full env list.
#
# Build context is the REPO ROOT (../.. from this file), matching services/docs' Railway config.
services:
  intel:
    build:
      context: ../..
      dockerfile: services/intel/Dockerfile
    container_name: caisson-intel
    restart: unless-stopped
    # Host-loopback only — no LAN/public exposure (identity/security.md docker port-exposure
    # policy: bind-level constraint, not a firewall rule). The daemon has no other inbound surface.
    ports:
      - "127.0.0.1:8791:8791"
    # Injected by the host's env file (sanitized-mirror pattern) — never committed. See
    # .env.example for the full var list; this service reads no other file at runtime.
    env_file:
      - .env
    logging:
      options:
        max-size: 20m
        max-file: "3"
