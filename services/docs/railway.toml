# Railway service config — services/docs (@caisson/service-docs). ADR-0096 / ADR-0105 / P6.
#
# Dashboard settings for THIS service (the build context must be the repo root, see Dockerfile header):
#   Root Directory       = /                          (repo root — the Docker build context)
#   Config-as-code path  = services/docs/railway.toml (this file)
#
# Service env vars (set in the Railway service — NEVER committed):
#   DOCS_SERVICE_TOKEN  (required; fail-closed — server refuses to start without it; mint a value
#                        and copy it in from your local env file)
#   OPENROUTER_API_KEY  (the live embedder; absent ⇒ FTS5 floor)
#   PORT                (Railway injects; server binds it)
[build]
builder = "DOCKERFILE"
dockerfilePath = "services/docs/Dockerfile"

[deploy]
healthcheckPath = "/health"
# 300s, not 30: /health answers immediately with a 503 {"ok":false,"warming":true} — Bun.serve
# binds the port and starts a warmup handler BEFORE the semantic index build runs, then swaps in
# the real handler once ready (server.ts). The real 200 doesn't land until embedding finishes,
# bounded by DocsIndex.build's own embed-phase deadline (DEFAULT_EMBED_PHASE_DEADLINE_MS, 3
# minutes); 300s keeps headroom above THAT ceiling so a genuinely-in-progress (or
# degrading-to-FTS) boot is never mistaken for a failed deploy and crash-looped.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1
