# Railway service config — services/docs (@caisson/service-docs). ADR-0096 / ADR-0105 / P6.
#
# Dashboard settings for THIS service (the build context must be the repo root, see Dockerfile header):
#   Root Directory       = /                          (repo root — the Docker build context)
#   Config-as-code path  = services/docs/railway.toml (this file)
#
# Service env vars (set in the Railway service — NEVER committed):
#   DOCS_SERVICE_TOKEN  (required; fail-closed — server refuses to start without it; mint a value
#                        and copy it in from your local env file)
#   OPENROUTER_API_KEY  (the live embedder; absent ⇒ FTS5 floor)
#   PORT                (Railway injects; server binds it)
[build]
builder = "DOCKERFILE"
dockerfilePath = "services/docs/Dockerfile"

[deploy]
healthcheckPath = "/health"
# /health answers immediately with a 503 {"ok":false,"warming":true} — Bun.serve binds the port
# and starts a warmup handler BEFORE the semantic index build runs, then swaps in the real handler
# once ready (server.ts). The real 200 doesn't land until embedding finishes, bounded by the
# embed-phase deadline — 3 minutes by default, raised via DOCS_EMBED_PHASE_DEADLINE_MS (set to
# 20 min in the service env 2026-07-10: the corpus outgrew the default — 77/489 chunks embedded
# per boot — and the volume embed-cache is not persisting between boots, so a full re-embed is
# the boot cost until that's fixed). This timeout MUST stay above the deadline env or a genuinely
# warming boot is mistaken for a failed deploy and crash-looped.
healthcheckTimeout = 1500
restartPolicyType = "ON_FAILURE"
numReplicas = 1
