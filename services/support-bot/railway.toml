# Railway service config — services/support-bot (caisson_support_bot). ADR-0009 / ADR-0105 / P6.
# DEPLOYED 2026-06-30 (service caisson-support-bot, project caisson-prod) — ● Online, connected to
# the Caisson.sh guild.
#
# Build: Railway uploads the REPO ROOT as context (it walks up to the project root), so the build is
# driven by the service var RAILWAY_DOCKERFILE_PATH=services/support-bot/Dockerfile and the Dockerfile
# COPYs are repo-root-relative. Without RAILWAY_DOCKERFILE_PATH, Railpack auto-detects the root bun
# workspace and fails ("no start command") — the var is mandatory.
#
# Service env vars (Railway service secrets — NEVER committed):
#   DISCORD_TOKEN       (required; the bot's gateway token)
#   OPENROUTER_API_KEY  (required; generation inference, ADR-0105)
#   DOCS_SERVICE_URL    (required; the deployed docs-service URL — https://docs-api.caisson.sh)
#   DOCS_SERVICE_TOKEN  (required; must match the docs service)
#   PORT + HEALTH_PORT  (both pinned to 8080 so Railway's /health probe matches the bot's health server)
#   DATABASE_URL        (optional; Postgres support_ticket escalation store)
#   SUPPORT_CHANNEL_ID / SUPPORT_HUMAN_ROLE_ID / OPENROUTER_MODEL  (optional; degrade gracefully)
#   BILLING_GRANT_TOKEN (optional; ADR-0203 — Bearer for POST /billing-grant. Unset ⇒ the route is
#                        not served; must match SUPPORT_BOT_GRANT_TOKEN on caisson-license + caisson-site)
#   GUILD_ID            (optional; ADR-0203 — pins billing grants to the Caisson guild, same id the
#                        provisioner uses. Unset ⇒ the bot's sole guild; several guilds + no id ⇒ refuse)
#   MEMBER_ROLE_ID / WELCOME_CHANNEL_ID / CUSTOMER_ROLE_ID / ROLE_*_ID  (optional; ADR-0109 member mgmt)
#   RAILWAY_DOCKERFILE_PATH=services/support-bot/Dockerfile  (mandatory — forces the Dockerfile builder)
[build]
builder = "DOCKERFILE"
dockerfilePath = "services/support-bot/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
numReplicas = 1
