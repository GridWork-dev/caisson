[project]
name = "caisson-support-bot"
version = "0.1.0"
description = "Caisson Discord AI support bot — codebase-grounded RAG over services/docs, AI-brief escalation (ADR-0009/0105)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-Caisson-Commercial" }
dependencies = [
    "discord.py>=2.4,<3",
    # Direct import for the inbound HTTP surface (billing_grant.py, ADR-0203) — discord.py's own
    # HTTP stack, so the pin adds no new dependency class; declared because we import it directly.
    "aiohttp>=3.10,<4",
    "httpx>=0.27,<0.29",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "asyncpg>=0.31,<0.32",
    # OTLP telemetry (ADR-0117/0142) — env-gated in telemetry.py; dormant unless OTEL_EXPORTER_OTLP_ENDPOINT.
    "opentelemetry-sdk>=1.29,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
    "opentelemetry-instrumentation-httpx>=0.50b0,<1",
    "opentelemetry-instrumentation-asyncpg>=0.50b0,<1",
]

[project.scripts]
caisson-support-bot = "caisson_support_bot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<1.5",
    "ruff>=0.15,<0.16",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caisson_support_bot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
# pycodestyle/pyflakes/isort/bugbear/comprehensions/pyupgrade/security(bandit).
select = ["E", "F", "I", "B", "C4", "UP", "S", "ASYNC"]
# `ruff format` owns line width (it wraps code and intentionally leaves long strings/comments/docstrings
# intact); E501 would then only nag about lines the formatter deliberately won't break, so it's off.
ignore = ["S101", "E501"] # assert is fine in tests; E501 deferred to the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # hardcoded test tokens are fine in tests

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The live-harness marker (ADR-0224): tests that hit a real external remote (Discord, Linear). The
# default `-m 'not live'` DESELECTS them so `uv run pytest tests` never collects/runs them (they also
# self-skip without creds). Run them explicitly with `uv run pytest -m live` (the command-line `-m`
# overrides this addopts default). --strict-markers so an unregistered marker is an error, not a typo.
markers = [
    "live: exercises a real external remote; excluded from default runs, run with -m live",
    "eval: offline eval gate (regression vs a committed baseline); excluded from default runs, run with -m eval",
]
addopts = "-m 'not live and not eval' --strict-markers"
