name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default: no job here pushes or writes back to the repo.
permissions:
  contents: read

# Trimmed sample CI: build · lint · unit. There is no `golden:` job here (unlike the buyer
# generator's `base` template) — this sample has no installed-module golden fixtures, only its own
# functional verify suite (`src/evidence-path.test.ts`), which `unit` already runs.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test ./src
