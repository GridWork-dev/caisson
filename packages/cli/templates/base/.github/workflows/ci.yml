name: ci
on:
  push:
    branches: [main]
  pull_request:

# Trimmed buyer-repo CI (ADR-0072): build · lint · unit · golden-file for the installed modules.
# Caisson's internal release machinery and authoring checks are not part of a buyer repo and are
# intentionally absent from this workflow — this is yours to extend.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test ./src

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Golden-file regression with BLESS unset — any drift in a committed baseline fails here.
      - run: bun test ./src
